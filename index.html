      }
      return null;
    }
    if(runs.some(r=>r.agentId===agentId&&(r.status==='running'||r.status==='gate'||r.status==='queued')))return null;
    if(queue.length>=MAX_QUEUE)return null;
    const p=planFor(agentId);
    const run={
      id:'AR-'+String(++seq).padStart(4,'0'), agentId, agentVersion:a.v,
      requestId:'REQ-'+Math.floor(rand()*1e6).toString(36).toUpperCase(),
      status:'queued', trigger:trigger||'manual',
      queuedH:h, startedH:null, endedH:null, started:CLOCK.date(),
      stepIdx:0, obj:p.obj, risco:p.risco, steps:p.steps,
      facts:p.facts, infers:p.infers, hypos:p.hypos, recs:p.recs, limits:p.limits,
      tokens:0, usd:0, toolCalls:0, simulated:true,
      ctx:{bacia:CTX.basinIds[0],evento:CTX.incidentId,fidelidade:CTX.fidelity}
    };
    cooldown[agentId]=h;
    runs.unshift(run); queue.push(run);
    if(runs.length>90)runs.length=90;
    return run;
  }
  function running(){return runs.filter(r=>r.status==='running')}
  function pump(){
    while(running().length<MAX_CONC&&queue.length){
      const r=queue.shift();
      if(r.status!=='queued')continue;
      r.status='running'; r.startedH=CLOCK.hour();
      r.steps[0].startedH=r.startedH;
      if(!activeRun||activeRun.status==='completed'||activeRun.status==='cancelled')activeRun=r;
      BUS.emit('agent.run.started',{run:r.id},
        {text:`<b>${r.agentId}</b> ${esc(agente(r.agentId).nome)} iniciado — ${esc(r.trigger)}`,sev:'modelado',mod:'M18',ref:r.id});
    }
  }
  function advance(h){
    running().forEach(r=>{
      const s=r.steps[r.stepIdx]; if(!s)return;
      if(s.startedH==null)s.startedH=h;
      if(h-s.startedH<s.durH)return;
      s.status='done'; s.t=CLOCK.date();
      r.toolCalls++; r.tokens+=Math.round(820+rand()*2600); r.usd+=Number((0.018+rand()*0.06).toFixed(3));
      BUS.emit('agent.step.completed',{run:r.id,tool:s.tool},
        {text:`<b>${r.agentId}</b> · <span class="mono">${esc(s.tool)}</span> — ${esc(s.out)}`,sev:'info',mod:'M18',ref:r.id});
      if(s.gate){
        r.status='gate';
        const ap={id:'AP-'+String(++seq).padStart(4,'0'),runId:r.id,agentId:r.agentId,acao:s.n,
          evid:r.facts.length+r.infers.length,conf:0.62+rand()*0.3,
          alcada:r.risco==='alto'?'Superintendente / DICOL':'Coordenação',prazo:'2 h',
          status:'pendente',at:CLOCK.date(),atH:h,out:s.out};
        STORE.approvals.unshift(ap);
        BUS.emit('decision.approval.required',{ap:ap.id},
          {text:`Gate humano — <b>${r.agentId}</b> propõe: ${esc(s.n)}. Alçada ${esc(ap.alcada)}.`,sev:'alerta',mod:'M18',ref:ap.id});
        return;
      }
      r.stepIdx++;
      if(r.stepIdx>=r.steps.length){
        r.status='completed'; r.endedH=h;
        BUS.emit('agent.run.completed',{run:r.id},
          {text:`<b>${r.agentId}</b> concluiu em ${fmt((r.endedH-r.startedH)*60,0)} min simulados · ${r.toolCalls} chamadas · ${r.recs.length} recomendações`,
           sev:'normal',mod:'M18',ref:r.id});
      }else r.steps[r.stepIdx].startedH=h;
    });
  }

  /* ---------- despacho autônomo por gatilho ---------- */
  const TRIGGERS=[
    {evt:'flood.product.ingested',   ags:['A11','A12'], t:'produto SAR ingerido'},
    {evt:'convergence.completed',    ags:['A13'],       t:'convergência recalculada'},
    {evt:'meteo.frame.received',     ags:['A05'],       t:'novo quadro de chuva', p:0.34},
    {evt:'station.reading.received', ags:['A04','A02'], t:'leitura telemétrica', p:0.12},
    {evt:'model.run.progress',       ags:['A06','A08'], t:'execução hidrológica', p:0.5},
    {evt:'model.forecast.published', ags:['A07','A09'], t:'cenário publicado'},
    {evt:'integration.sla.breached', ags:['A20'],       t:'SLA de integração em risco', p:0.55},
    {evt:'incident.level.changed',   ags:['A01','A14'], t:'mudança no evento'},
    {evt:'field.evidence.synced',    ags:['A17'],       t:'evidência de campo sincronizada'},
    {evt:'decision.approval.required',ags:['A19'],      t:'gate registrado', p:0.4},
    {evt:'context.changed',          ags:['A03'],       t:'contexto alterado', p:0.25}
  ];
  TRIGGERS.forEach(tr=>BUS.on(tr.evt,()=>{
    if(!auto)return;
    if(tr.p!=null&&rand()>tr.p)return;
    tr.ags.forEach(id=>enqueue(id,tr.t));
    pump();
  }));
  // rotinas periódicas da frota
  const PERIODICOS=[['A15',12,'perspectiva climática'],['A10',6,'ciclo de aquisição'],
    ['A18',8,'produto de comunicação'],['A16',9,'estado dos reservatórios'],
    ['A21',14,'caso regulatório'],['A03',10,'auditoria de linhagem'],['A19',7,'verificação de política'],
    ['A04',5,'varredura da rede telemétrica'],['A02',11,'perfilagem de qualidade de dados']];
  const perFired={};

  /* ---------- relógio ---------- */
  CLOCK.onTick(()=>{
    const h=CLOCK.hour();
    if(h<lastTickH-0.2){                    // replay: poda o que ainda não aconteceu
      runs=runs.filter(r=>r.queuedH<=h);
      queue=queue.filter(r=>r.queuedH<=h);
      STORE.approvals=STORE.approvals.filter(a=>a.atH==null||a.atH<=h);
      for(const k in cooldown)delete cooldown[k];
      for(const k in perFired)delete perFired[k];
      if(activeRun&&activeRun.queuedH>h)activeRun=runs[0]||null;
    }
    lastTickH=h;
    // a fila envelhece: pedido cujo contexto já passou é descartado, não executado tarde
    for(let i=queue.length-1;i>=0;i--){
      const r=queue[i];
      if(h-r.queuedH>6){
        queue.splice(i,1); r.status='cancelled'; r.endedH=h;
        BUS.emit('agent.run.completed',{run:r.id},
          {text:`Execução de <b>${r.agentId}</b> descartada da fila — contexto do gatilho "${esc(r.trigger)}" já expirou`,
           sev:'atencao',mod:'M18',ref:r.id});
      }
    }
    // o prazo do gate também corre: sem decisão em 4 h simuladas, escala e expira
    STORE.approvals.filter(a=>a.status==='pendente'&&!a.escalado&&a.atH!=null&&h-a.atH>6).forEach(a=>{
      a.escalado=true; a.alcada='Escalado — '+a.alcada;
      const r=runs.find(x=>x.id===a.runId);
      if(r&&r.status==='gate')r.status='paused';
      BUS.emit('decision.approval.required',{ap:a.id},
        {text:`Gate de <b>${a.agentId}</b> sem decisão há 6 h — "${esc(a.acao)}" escalado para ${esc(a.alcada)}`,
         sev:'alerta',mod:'M18',ref:a.id});
      STORE.audits.unshift({id:uid('AU'),at:CLOCK.date(),ator:'sistema',acao:'Escalonamento de gate por prazo',
        alvo:a.agentId+' · '+a.acao,resultado:'escalado',corr:a.runId});
    });
    if(auto)PERIODICOS.forEach(p=>{
      const n=Math.floor(h/p[1]), k=p[0]+'_'+n;
      if(!perFired[k]&&h>0){perFired[k]=1;enqueue(p[0],p[2])}
    });
    pump(); advance(h);
  });

  /* ---------- intervenção humana ---------- */
  function approve(apId,dec){
    const ap=STORE.approvals.find(a=>a.id===apId); if(!ap||ap.status!=='pendente')return;
    ap.status=dec; ap.decidedAt=CLOCK.date(); ap.decidedBy=CTX.user;
    const run=runs.find(r=>r.id===ap.runId);
    BUS.emit('agent.gate.decided',{},
      {text:`Aprovação <b>${dec}</b> por ${esc(CTX.user)} — "${esc(ap.acao)}" do agente ${ap.agentId}`,
       sev:dec==='rejeitada'?'atencao':'normal',mod:'M18',ref:apId});
    STORE.audits.unshift({id:uid('AU'),at:CLOCK.date(),ator:CTX.user,acao:'Decisão sobre gate de agente',
      alvo:ap.agentId+' · '+ap.acao,resultado:dec,corr:ap.runId});
    if(run){
      if(dec==='rejeitada'){run.status='cancelled';run.endedH=CLOCK.hour();
        UI.toast('Ação rejeitada','A execução foi interrompida e o registro preservado.','warn')}
      else{
        run.stepIdx++;
        if(run.stepIdx>=run.steps.length){run.status='completed';run.endedH=CLOCK.hour()}
        else{run.status='running';run.steps[run.stepIdx].startedH=CLOCK.hour();pump()}
        UI.toast('Ação aprovada','Registrada com autor, timestamp e correlação.','ok');
      }
    }
    APP.rerender();
  }
  function intervene(runId,kind){
    const run=runs.find(r=>r.id===runId); if(!run)return;
    if(kind==='pause'){run.status='paused';UI.toast('Execução pausada','Estado preservado para retomada humana.','warn')}
    if(kind==='resume'){run.status='running';const s=run.steps[run.stepIdx];if(s)s.startedH=CLOCK.hour();UI.toast('Execução retomada','','ok')}
    if(kind==='cancel'){run.status='cancelled';run.endedH=CLOCK.hour();UI.toast('Execução cancelada','','err')}
    if(kind==='takeover'){run.status='takeover';UI.toast('Controle assumido',CTX.user+' assumiu a execução sem perder o contexto acumulado.','ai')}
    BUS.emit('agent.intervention',{},
      {text:`Intervenção humana <b>${kind}</b> na execução ${run.id} (${run.agentId})`,sev:'atencao',mod:'M18',ref:runId});
    APP.rerender();
  }
  function killAll(){
    runs.forEach(r=>{if(r.status==='running'||r.status==='queued')r.status='paused'});
    queue.length=0; auto=false;
    BUS.emit('agent.intervention',{},{text:'<b>Kill switch global</b> acionado — frota pausada com estado preservado',sev:'critico',mod:'M18'});
    UI.toast('Kill switch acionado','Frota pausada. Os estados foram preservados para retomada humana.','err');
    APP.rerender();
  }
  function setAuto(v){
    auto=!!v;
    BUS.emit('agent.intervention',{},
      {text:`Despacho autônomo <b>${auto?'ativado':'desativado'}</b> por ${esc(CTX.user)}`,sev:auto?'normal':'atencao',mod:'M18'});
    APP.rerender();
  }
  function start(id){
    const r=enqueue(id,'solicitação do operador');
    if(!r){UI.toast('Execução não enfileirada','O agente já está em execução ou dentro do período de resfriamento.','warn');return null}
    pump(); APP.rightTab='agent'; APP.rightOpen=true; activeRun=r;
    UI.toast('Agente enfileirado',agente(id).nome+' — acompanhe o trace no painel direito ou em M18-02.','ai');
    APP.rerender(); return r;
  }

  /* ---------- estado agregado da frota ---------- */
  function fleet(){
    return AGENTES.map(a=>{
      const r=runs.find(x=>x.agentId===a.id&&(x.status==='running'||x.status==='gate'||x.status==='queued'||x.status==='paused'));
      const done=runs.filter(x=>x.agentId===a.id&&x.status==='completed').length;
      let prog=0;
      if(r&&r.steps.length){
        const s=r.steps[r.stepIdx];
        const frac=s&&s.startedH!=null?clamp((CLOCK.hour()-s.startedH)/s.durH,0,1):0;
        prog=(r.stepIdx+frac)/r.steps.length*100;
      }
      return {a,run:r,status:r?r.status:'ocioso',prog,done,
        step:r&&r.steps[r.stepIdx]?r.steps[r.stepIdx].n:null};
    });
  }
  function stats(){
    const h=CLOCK.hour();
    return {
      running:running().length, queued:queue.length,
      gates:STORE.approvals.filter(a=>a.status==='pendente').length,
      completed:runs.filter(r=>r.status==='completed').length,
      cancelled:runs.filter(r=>r.status==='cancelled').length,
      toolCalls:runs.reduce((s,r)=>s+r.toolCalls,0),
      tokens:runs.reduce((s,r)=>s+r.tokens,0),
      usd:runs.reduce((s,r)=>s+r.usd,0),
      throughput:h>0?runs.filter(r=>r.status==='completed').length/Math.max(1,h)*24:0,
      auto
    };
  }

  /* ---------- render do trace ---------- */
  function traceHTML(run,compact){
    if(!run)return UI.state('Nenhuma execução selecionada','A frota despacha agentes automaticamente conforme os gatilhos do barramento. Selecione uma execução no cockpit ou inicie uma manualmente.','◈');
    const a=agente(run.agentId), h=CLOCK.hour();
    const cur=run.steps[run.stepIdx];
    const frac=cur&&cur.startedH!=null&&run.status==='running'?clamp((h-cur.startedH)/cur.durH,0,1):0;
    return `
      <div class="flexr mb6">
        <span class="badge b-modelado">${run.agentId} v${run.agentVersion}</span>
        <b style="font-size:12.5px">${esc(a.nome)}</b>
        ${UI.badge(statusLabel(run.status),statusSev(run.status))}
        <span class="tiny faint mono" style="margin-left:auto">${esc(run.id)}</span>
      </div>
      <div class="tiny dim mb6">${esc(run.obj)}</div>
      <div class="flexr tiny faint mb6">
        <span>gatilho: ${esc(run.trigger)}</span><span>·</span><span>risco ${esc(run.risco)}</span><span>·</span>
        <span class="mono">${run.toolCalls} chamadas · ${fmt0(run.tokens)} tokens · US$ ${fmt(run.usd,3)}</span></div>
      ${run.status==='running'?UI.prog((run.stepIdx+frac)/run.steps.length*100):''}
      <div class="trace" style="margin-top:8px">
        ${run.steps.map((s,i)=>{
          const st=s.status==='done'?'done':(i===run.stepIdx&&run.status==='running')?'run':
                   (i===run.stepIdx&&run.status==='gate')?'gate':(run.status==='cancelled'&&i===run.stepIdx)?'fail':'';
          return `<div class="tstep ${st}">
          <div class="st"><span class="nm">${i+1}. ${esc(s.n)}</span>
            ${s.gate?'<span class="badge b-atencao">gate humano</span>':''}
            <span class="tm">${s.t?hhmm(s.t):(st==='run'?fmt(frac*100,0)+'%':'—')}</span></div>
          <div class="sd">${esc(s.d)}</div>
          ${s.status!=='pending'||st==='run'?`<div class="tool"><span class="tn">▸ ${esc(s.tool)}</span>
            <span class="to">in  ${esc(s.in)}</span>
            <span class="to">out ${s.status==='done'?esc(s.out):'<em style="color:var(--hidro)">executando…</em>'}</span></div>`:''}
        </div>`}).join('')}
      </div>
      ${compact?'':`
      <div class="rp-sec" style="margin-top:12px"><div class="t">Fatos recuperados</div>
        ${run.facts.map(f=>`<div class="fact">${esc(f)}</div>`).join('')||'<div class="tiny faint">—</div>'}</div>
      <div class="rp-sec"><div class="t">Inferências</div>
        ${run.infers.map(f=>`<div class="infer">${esc(f)}</div>`).join('')||'<div class="tiny faint">—</div>'}</div>
      <div class="rp-sec"><div class="t">Hipóteses</div>
        ${run.hypos.map(f=>`<div class="hypo">${esc(f)}</div>`).join('')||'<div class="tiny faint">Nenhuma hipótese formulada.</div>'}</div>
      <div class="rp-sec"><div class="t">Recomendações</div>
        ${run.recs.map(f=>`<div class="recc">${esc(f)}</div>`).join('')||'<div class="tiny faint">—</div>'}</div>
      <div class="rp-sec"><div class="t">Limites declarados</div>
        ${run.limits.map(f=>`<div class="limit">${esc(f)}</div>`).join('')}</div>`}`;
  }
  function statusLabel(s){return {queued:'na fila',running:'executando',gate:'aguardando gate',
    completed:'concluída',cancelled:'cancelada',paused:'pausada',takeover:'assumida',ocioso:'ocioso'}[s]||s}
  function statusSev(s){return {queued:'info',running:'info',gate:'atencao',completed:'normal',
    cancelled:'critico',paused:'atencao',takeover:'modelado',ocioso:'semdados'}[s]||'semdados'}

  function gateCard(a){
    return `<div class="gatebox mb6">
      <div class="gt">Gate humano</div>
      <div style="font-size:11.5px;margin:4px 0">${esc(a.acao)}</div>
      <div class="tiny faint mono mb6">${a.agentId} · confiança ${fmt(a.conf*100,0)}% · alçada ${esc(a.alcada)} · prazo ${esc(a.prazo)}
        ${a.escalado?'<span class="badge b-critico" style="margin-left:5px">escalado por prazo</span>':''}</div>
      <div class="tiny dim mb6">${esc(a.out)}</div>
      <div class="flexr">
        <button class="btn btn-sm btn-g" data-approve="${a.id}" data-dec="aprovada">Aprovar</button>
        <button class="btn btn-sm" data-approve="${a.id}" data-dec="editada">Editar e aprovar</button>
        <button class="btn btn-sm btn-d" data-approve="${a.id}" data-dec="rejeitada">Rejeitar</button>
      </div></div>`;
  }
  function panel(){
    const pend=STORE.approvals.filter(a=>a.status==='pendente');
    const act=running();
    return `<div class="rp-sec"><div class="t">Frota · ${act.length} em execução · ${queue.length} na fila</div>
      ${act.length?act.map(r=>`<button class="kbc w100" style="text-align:left;border-left-color:var(--hidro);margin-bottom:6px"
        onclick="AGENTS.setActive('${r.id}')">
        <div class="flexr"><span class="badge b-modelado">${r.agentId}</span>
          <span class="tiny" style="flex:1">${esc(r.steps[r.stepIdx]?r.steps[r.stepIdx].n:'—')}</span></div>
        <div style="margin-top:5px">${UI.prog(r.stepIdx/r.steps.length*100)}</div>
      </button>`).join(''):'<div class="tiny faint">Nenhuma execução ativa neste instante.</div>'}
    </div>
    <div class="rp-sec"><div class="t">Execução selecionada</div>${traceHTML(activeRun,true)}
      ${activeRun?`<div class="flexr mt10">
        <button class="btn btn-sm" onclick="AGENTS.intervene('${activeRun.id}','pause')">❚❚ Pausar</button>
        <button class="btn btn-sm" onclick="AGENTS.intervene('${activeRun.id}','takeover')">✋ Assumir</button>
        <button class="btn btn-sm btn-d" onclick="AGENTS.intervene('${activeRun.id}','cancel')">Cancelar</button>
      </div>`:''}</div>
    ${pend.length?`<div class="rp-sec"><div class="t">Gates aguardando decisão</div>
      ${pend.slice(0,3).map(a=>gateCard(a)).join('')}</div>`:''}
    <div class="rp-sec"><div class="t">Iniciar agente manualmente</div>
      <div class="flexc">
        ${['A13','A12','A16','A21','A04','A10'].map(id=>`<button class="btn" onclick="AGENTS.start('${id}')">
          <span class="badge b-modelado">${id}</span> ${esc(agente(id).nome)}</button>`).join('')}
      </div></div>`;
  }
  function approvalPanel(){
    const all=STORE.approvals;
    if(!all.length)return `<div class="rp-sec"><div class="t">Aprovações</div>
      ${UI.state('Nenhum gate pendente','A frota levanta um gate sempre que uma ação atinge um limite de autoridade.','✓')}</div>`;
    return `<div class="rp-sec"><div class="t">Fila de aprovação · ${all.filter(a=>a.status==='pendente').length} pendentes</div>
      ${all.slice(0,14).map(a=>a.status==='pendente'?gateCard(a):`<div class="card mb6"><div class="card-b" style="padding:8px">
        <div class="flexr">${UI.badge(a.status,a.status==='rejeitada'?'critico':a.status==='expirada'?'alerta':'normal')}
          <span class="tiny faint mono" style="margin-left:auto">${stamp(a.decidedAt||a.at)}</span></div>
        <div style="font-size:11.5px;margin-top:3px">${esc(a.acao)}</div>
        <div class="tiny faint">${a.agentId} · decidido por ${esc(a.decidedBy||'—')}</div></div></div>`).join('')}</div>`;
  }

  return {start,approve,intervene,killAll,setAuto,panel,approvalPanel,traceHTML,gateCard,
    fleet,stats,statusLabel,statusSev,
    runs:()=>runs, queue:()=>queue, active:()=>activeRun,
    setActive:(id)=>{const r=typeof id==='string'?runs.find(x=>x.id===id):id;if(r){activeRun=r;APP.rightTab='agent';APP.rightOpen=true;APP.rerender()}},
    isAuto:()=>auto, PLANOS};
})();
</script>
<script>
/* ============================================================================
   TELAS — helpers compartilhados
   ========================================================================== */
const SCREENS={};

function kpiRow(list,cols){return `<div class="grid g${cols||5}" style="margin-bottom:10px">${list.map(UI.kpi).join('')}</div>`}
function srcOf(a,b,c){return UI.srcFoot(a,b,c)}
function hydroSeries(){
  const line=[],rain=[],band=[],pred=[];
  for(let h=0;h<=72;h+=.5){
    line.push([h,stageAt(h)]);
    band.push([h,stageAt(h)*0.88-0.12,stageAt(h)*1.14+0.16]);
    pred.push([h,stageAt(h+3)*0.94]);
  }
  for(let h=0;h<=72;h+=1)rain.push([h,rainAt(h)]);
  return {line,rain,band,pred};
}
function hydroCard(o){
  o=o||{};
  const s=hydroSeries();
  const nowH=CLOCK.hour();
  return UI.card(o.title||'Hidrograma do sistema Guaíba — Cais Mauá (87450004)',
    CH.hydro({h:o.h||236,x0:0,x1:72,xstep:6,yd:2,ymax:PEAK_STAGE*1.35,
      line:s.line.filter(p=>p[0]<=nowH), band:o.band!==false?s.band:null, pred:o.pred!==false?s.pred.filter(p=>p[0]>nowH-1):null,
      rain:s.rain.filter(p=>p[0]<=nowH), now:nowH,
      xlab:h=>ddmm(addH(CLOCK.T0,h))+' '+String(Math.floor(h)%24).padStart(2,'0')+'h',
      thresholds:[{v:NIVEIS.atencao,l:'ATENÇÃO 2,40',c:'#E8A317'},{v:NIVEIS.alerta,l:'ALERTA 3,00',c:'#FF8534'},
        {v:NIVEIS.inundacao,l:'INUNDAÇÃO 4,50',c:'#FF4A5F'}],
      marks:[{x:PEAK_H,l:'PICO PREVISTO',c:'#9D7BFF',dy:24},{x:PEAK_H+3,l:'PICO OBSERVADO',c:'#19D3E8',dy:36}]}),
    {sub:'observado · faixa de ensemble · previsão 12 h',
     right:`<span class="badge b-hidro">nível ${fmt(stageAt(nowH),2)} m</span>${UI.badge(stageSev(stageAt(nowH)),stageSev(stageAt(nowH)))}`,

<script>
/* ============================================================================
   M8-06 · SIMULADOR E CENÁRIOS   ·   M8-07 · PROPAGAÇÃO EM CADEIA
   ========================================================================== */

/* ---------- estado do simulador ---------- */
const SIM8 = { sev:1.00, dur:5, resp:30, restr:false, dim:'fin' };

/* Fatores de ajuste por dimensão. A resposta antecipada e a restrição
   preventiva protegem pessoas e ambiente — e custam dinheiro. O trade-off
   é explícito porque é ele que a decisão precisa enxergar. */
function fatoresSim(){
  const f={fin:1,hum:1,soc:1,inf:1,amb:1};
  Object.keys(f).forEach(k=>f[k]*=SIM8.sev);
  const d=(SIM8.dur-5)/4;                         // duração acima do limiar
  f.hum*=1+0.28*d; f.soc*=1+0.34*d; f.amb*=1+0.30*d; f.inf*=1+0.22*d; f.fin*=1+0.18*d;
  const r=SIM8.resp/90;                           // antecipação da resposta
  f.hum*=1-0.32*r; f.soc*=1-0.38*r; f.inf*=1-0.22*r; f.fin*=1+0.07*r;
  if(SIM8.restr){ f.hum*=0.78; f.soc*=0.86; f.amb*=0.72; f.fin*=1.14; f.inf*=0.91; }
  Object.keys(f).forEach(k=>f[k]=Math.max(0.05,f[k]));
  return f;
}
function projetarSim(triId,fat){
  const base=projetarCusto(triId||ENSOUI.tri);
  const f=fat||fatoresSim();
  return base.map(d=>{
    const k=f[d.id]==null?1:f[d.id];
    return Object.assign({},d,{p25:d.p25*k,p50:d.p50*k,p75:d.p75*k,fator:k});
  });
}
/* Cenários fixos para comparação lado a lado */
const CENARIOS = [
  {id:'oti', nome:'Otimista',  desc:'Enfraquecimento antecipado, resposta preparada.',
   sev:0.62, dur:3, resp:75, restr:true,  cor:'var(--normal)', sevTag:'normal'},
  {id:'pes', nome:'Pessimista',desc:'Evento recorde, resposta reativa.',
   sev:1.24, dur:8, resp:10, restr:false, cor:'var(--critico)', sevTag:'critico'}
];
function fatoresDe(c){
  const guardar={sev:SIM8.sev,dur:SIM8.dur,resp:SIM8.resp,restr:SIM8.restr};
  Object.assign(SIM8,{sev:c.sev,dur:c.dur,resp:c.resp,restr:c.restr});
  const f=fatoresSim();
  Object.assign(SIM8,guardar);
  return f;
}
function totalFin(dims){ return dims.find(d=>d.id==='fin').p50; }

/* Blocos redesenhados sem re-render global, para o controle não perder o foco */
function simResultado(){
  const dims=projetarSim();
  const base=projetarCusto(ENSOUI.tri);
  return `<div class="grid g5" style="gap:8px">
    ${dims.map((d,i)=>{
      const b=base[i], delta=(d.p50-b.p50)/(b.p50||1)*100;
      return `<div class="kpi" style="color:${sevColor(d.sev)};padding-left:24px">
        <div class="rule"><i style="top:22%"></i><i style="top:50%"></i><i style="top:78%"></i>
          <b style="top:${clamp(100-d.conv*100,4,94)}%"></b></div>
        <div class="kl">${esc(d.nome)}</div>
        <div class="kv" style="font-size:20px;color:${sevColor(d.sev)}">${esc(fmtDim(d.p50,d.un))}</div>
        <div class="kd"><span class="trend ${delta>1?'up':delta<-1?'down':'flat'}">
          ${delta>0?'▲ +':delta<0?'▼ ':''}${fmt(Math.abs(delta),0)}%</span>
          <span class="tiny faint">vs referência</span></div>
        <div class="tiny faint mono" style="margin-top:3px">${esc(fmtDim(d.p25,d.un))} – ${esc(fmtDim(d.p75,d.un))}</div>
      </div>`}).join('')}
  </div>`;
}
function simComparativo(){
  const meu=projetarSim();
  const cols=[
    {n:CENARIOS[0].nome, d:CENARIOS[0].desc, dims:projetarSim(ENSOUI.tri,fatoresDe(CENARIOS[0])), cor:CENARIOS[0].cor, mid:false, tag:'normal'},
    {n:'Seu cenário',    d:'Parâmetros definidos nos controles ao lado.', dims:meu, cor:'var(--hidro)', mid:true, tag:'info'},
    {n:CENARIOS[1].nome, d:CENARIOS[1].desc, dims:projetarSim(ENSOUI.tri,fatoresDe(CENARIOS[1])), cor:CENARIOS[1].cor, mid:false, tag:'critico'}
  ];
  const maxFin=Math.max(...cols.map(c=>totalFin(c.dims)));
  return `<div class="grid g3" style="gap:9px">
    ${cols.map(c=>`<div class="cmpcol ${c.mid?'mid':''}">
      <div class="ch">
        <div class="flexr"><b style="font-size:12.5px;color:${c.cor}">${esc(c.n)}</b>
          ${UI.badge(fmt(totalFin(c.dims)/maxFin*100,0)+'%',c.tag)}</div>
        <div class="tiny faint" style="margin-top:2px;line-height:1.35;min-height:26px">${esc(c.d)}</div>
      </div>
      <div class="cb">
        ${c.dims.map(d=>`<div style="margin-bottom:7px">
          <div class="flexr tiny"><span style="flex:1">${esc(d.nome)}</span>
            <span class="mono" style="color:var(--ink)">${esc(fmtDim(d.p50,d.un))}</span></div>
          <div class="bar" style="margin-top:2px"><i style="width:${clamp(d.p50/(d.id==='fin'?maxFin:d.p50*1.6)*100,4,100)}%;background:${c.cor}"></i></div>
        </div>`).join('')}
      </div>
    </div>`).join('')}
  </div>`;
}
function simUpdate(){
  const a=document.getElementById('simOut'); if(a)a.innerHTML=simResultado();
  if(typeof ENSOMAP!=='undefined'&&ENSOMAP.usarSim&&typeof MAPS!=='undefined'){
    try{MAPS.refreshENSO()}catch(e){}
  }
  const b=document.getElementById('simCmp'); if(b)b.innerHTML=simComparativo();
  const c=document.getElementById('simLbl');
  if(c)c.innerHTML=`severidade ${fmt(SIM8.sev*100,0)}% · duração ${SIM8.dur} meses · resposta ${SIM8.resp} dias`
    +(SIM8.restr?' · com restrição preventiva':'');
  ['sev','dur','resp'].forEach(k=>{const n=document.getElementById('v_'+k);
    if(n)n.textContent = k==='sev'?fmt(SIM8.sev*100,0)+'%' : k==='dur'?SIM8.dur+' meses' : SIM8.resp+' dias';});
  const t=document.getElementById('swRestr');
  if(t)t.className='swt '+(SIM8.restr?'on':'');
}

/* ---------- propagação do gargalo entre setores ---------- */
const CASCATA = [
  {nv:0,id:'clima', nome:'Anomalia climática',    sub:'Déficit de chuva de 17% a 29%', sev:'critico'},
  {nv:1,id:'vazao', nome:'Vazão e armazenamento', sub:'Queda de afluência e de volume útil', sev:'critico'},

  {nv:2,id:'outo',  nome:'Outorga',               sub:'Demanda concedida acima da oferta', sev:'critico'},
  {nv:2,id:'irri',  nome:'Irrigação',             sub:'Área irrigada sem fonte segura', sev:'alerta'},
  {nv:2,id:'logi',  nome:'Logística',             sub:'Calado e eclusa fora da faixa', sev:'alerta'},
  {nv:3,id:'sane',  nome:'Saneamento',            sub:'Rodízio e perda de pressão', sev:'critico'},
  {nv:3,id:'ener',  nome:'Energia',               sub:'Despacho térmico substituindo hídrica', sev:'critico'},
  {nv:3,id:'agro',  nome:'Agropecuária',          sub:'Perda de safra e de rebanho', sev:'alerta'},
  {nv:3,id:'indu',  nome:'Indústria',             sub:'Redução de marcha por falta de água', sev:'alerta'},
  {nv:3,id:'tran',  nome:'Transporte',            sub:'Transbordo rodoviário forçado', sev:'atencao'},
  {nv:4,id:'cust',  nome:'Custo projetado',       sub:'Cinco dimensões consolidadas', sev:'modelado'}
];
const PROPAG = [
  {de:'Nível de rio',  para:'Captação',   mec:'Cota da tomada d’água acima da lâmina disponível', lag:'0–15 d', amp:1.0, dim:'Infraestrutura', ordem:1},
  {de:'Captação',      para:'Saneamento', mec:'Redução de vazão captada obriga rodízio de abastecimento', lag:'5–20 d', amp:1.4, dim:'Humano', ordem:1},
  {de:'Saneamento',    para:'Saúde',      mec:'Intermitência eleva doença de veiculação hídrica', lag:'20–60 d', amp:1.9, dim:'Social', ordem:2},
  {de:'Vazão',         para:'Energia',    mec:'Queda de afluência aciona despacho térmico', lag:'0–30 d', amp:1.2, dim:'Financeiro', ordem:1},
  {de:'Energia',       para:'Indústria',  mec:'Custo marginal eleva tarifa e comprime margem', lag:'30–90 d', amp:1.6, dim:'Financeiro', ordem:2},
  {de:'Outorga',       para:'Irrigação',  mec:'Alocação negociada corta a fatia da irrigação', lag:'15–45 d', amp:1.3, dim:'Financeiro', ordem:1},
  {de:'Irrigação',     para:'Agropecuária',mec:'Perda de produtividade e de área plantada', lag:'60–120 d', amp:1.8, dim:'Financeiro', ordem:2},
  {de:'Agropecuária',  para:'Emprego rural',mec:'Redução de posto de trabalho sazonal', lag:'90–180 d', amp:2.1, dim:'Social', ordem:3},
  {de:'Nível de rio',  para:'Logística',  mec:'Calado restrito reduz carga por comboio', lag:'0–10 d', amp:1.1, dim:'Financeiro', ordem:1},
  {de:'Logística',     para:'Abastecimento',mec:'Combustível e alimento encarecem em cidade isolada', lag:'10–40 d', amp:2.4, dim:'Humano', ordem:2},
  {de:'Vazão',         para:'Ecossistema',mec:'Vazão ecológica não atendida e mortandade de fauna', lag:'15–60 d', amp:1.5, dim:'Ambiental', ordem:1},
  {de:'Ecossistema',   para:'Pesca',      mec:'Queda de estoque pesqueiro e de renda ribeirinha', lag:'60–180 d', amp:1.7, dim:'Social', ordem:2},
  {de:'Indústria',     para:'Emprego urbano',mec:'Suspensão de turno em polo industrial', lag:'60–120 d', amp:1.4, dim:'Social', ordem:3},
  {de:'Energia',       para:'Tarifa',     mec:'Bandeira tarifária pressiona custo domiciliar', lag:'30–60 d', amp:1.3, dim:'Financeiro', ordem:2}
];

SCREENS.M8.splice(6,0,
{id:'M8-07',nome:'Simulador e cenários',badge:['ao vivo','info'],
 obj:'Ajuste severidade, duração e antecipação da resposta e veja o custo mudar. O trade-off entre proteger pessoas e gastar dinheiro fica explícito.',
 actions:[{t:'Restaurar referência',fn:()=>{Object.assign(SIM8,{sev:1.0,dur:5,resp:30,restr:false});APP.rerender()}},
   {t:'Adotar como cenário de planejamento',k:'btn-p',fn:()=>{
     UI.toast('Cenário adotado','Parâmetros registrados com autor e horário. Segue para a fila de decisão.','ok');
     BUS.emit('decision.approval.required',{},
       {text:`Cenário de planejamento ENSO adotado — severidade ${fmt(SIM8.sev*100,0)}%, resposta ${SIM8.resp} dias`,
        sev:'alerta',mod:'M8'});}}],
 after(){ simUpdate(); },
 render(){
  const t=trimestre(ENSOUI.tri);
  return `<div class="flexr mb6"><span class="eyebrow">Trimestre</span>${selTri()}
    <span class="tiny faint mono" id="simLbl" style="margin-left:auto"></span></div>

  <div class="grid gB">
    ${UI.card('Parâmetros do cenário',`
      <div class="simctl">
        <div class="hd"><b>Severidade do evento</b><span class="v" id="v_sev">${fmt(SIM8.sev*100,0)}%</span></div>
        <input type="range" class="rng" min="40" max="130" step="2" value="${Math.round(SIM8.sev*100)}"
          oninput="SIM8.sev=this.value/100;simUpdate()">
        <div class="ex">100% corresponde ao pico projetado de NDJ 2026. Acima disso, evento recorde.</div>
      </div>
      <div class="simctl">
        <div class="hd"><b>Duração acima do limiar</b><span class="v" id="v_dur">${SIM8.dur} meses</span></div>
        <input type="range" class="rng" min="2" max="10" step="1" value="${SIM8.dur}"
          oninput="SIM8.dur=Number(this.value);simUpdate()">
        <div class="ex">Meses com ONI acima de +1,5 °C. A duração pesa mais no impacto humano e social que no financeiro.</div>
      </div>
      <div class="simctl">
        <div class="hd"><b>Antecipação da resposta</b><span class="v" id="v_resp">${SIM8.resp} dias</span></div>
        <input type="range" class="rng" min="0" max="90" step="5" value="${SIM8.resp}"
          oninput="SIM8.resp=Number(this.value);simUpdate()">
        <div class="ex">Dias entre a decisão de preparar e o início do impacto. Reduz custo humano e eleva o financeiro.</div>
      </div>
      <hr class="hr">
      <div class="swt ${SIM8.restr?'on':''}" id="swRestr"
        onclick="SIM8.restr=!SIM8.restr;simUpdate()"><i></i>Restrição preventiva de captação</div>
      <div class="ex" style="margin-top:4px">Protege abastecimento humano e vazão ecológica. Em contrapartida,
      transfere perda para irrigação e indústria.</div>
      ${limitNote('Os fatores de mitigação são premissas do modelo, não resultados medidos. Servem para comparar alternativas, não para prometer efeito.')}`,
      {sub:'arraste para recalcular',foot:srcOf('M8 · modelo paramétrico · '+esc(t.nome),null,'C')})}

    <div class="flexc">
      ${UI.card('Custo com os parâmetros atuais','<div id="simOut">'+simResultado()+'</div>',
        {sub:'variação medida contra o cenário de referência do trimestre',
         foot:srcOf('M8 · recálculo ao vivo',null,'C')})}
      ${UI.card('Leitura do trade-off',`<div class="doc" style="font-size:11.5px">
        <p>Aumentar a antecipação da resposta de 0 para 90 dias reduz a exposição humana em torno de 32% e a social

<script>
/* ============================================================================
   BOOT
   ========================================================================== */
(function boot(){
  // rota inicial a partir do hash, se houver
  const h=location.hash.replace('#/','');
  if(h){
    const parts=h.split('/');
    const scr=(parts[1]||'').toUpperCase();
    const mod=scr.split('-')[0];
    if(SCREENS[mod]&&SCREENS[mod].some(s=>s.id===scr)){APP.module=mod;APP.screen=scr}
  }

  Shell.renderAll();

  // re-render periódico leve para acompanhar o relógio
  let lastMin=-1, lastFrame=-1;
  CLOCK.onTick(()=>{
    const m=Math.floor(CLOCK.hour()*60);
    const fi=frameNow().i;
    if(m!==lastMin){
      lastMin=m;
      const c=$('#topbar .clock');
      if(c){const d=CLOCK.date();
        c.innerHTML=`<span class="d">${ddmm(d)}</span> ${hhmm(d)} <span class="d">BRT · h+${fmt(CLOCK.hour(),1)}</span>`}
      const tw=$('#transWrap'); if(tw)tw.innerHTML=Shell.timelineSVG();
    }
    if(fi!==lastFrame){lastFrame=fi;APP.rerender()}
  });

  // barramento alimenta o event rail sem re-render completo
  BUS.on('*',()=>{
    const rail=$('#eventrail .rail-r > div:last-child');
    if(!rail||!APP.railOpen)return;
    const e=BUS.log[BUS.log.length-1];
    const n=el('div',{class:'evt new','data-mod':e.mod},
      `<span class="tm">${hhmm(e.at)}</span>
       <span class="tx"><span class="badge ${sevClass(e.sev)}" style="margin-right:5px">${esc(e.mod||'sys')}</span>${e.text}</span>`);
    n.onclick=()=>{if(e.mod&&SCREENS[e.mod])APP.goModule(e.mod)};
    rail.insertBefore(n,rail.firstChild);
    while(rail.children.length>70)rail.removeChild(rail.lastChild);
  });

  // atalhos
  document.addEventListener('keydown',e=>{
    const tag=(e.target.tagName||'').toLowerCase();
    const typing=tag==='input'||tag==='textarea'||tag==='select';
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();Shell.togglePalette(true);return}
    if(e.key==='Escape'){Shell.togglePalette(false);Shell.toggleLauncher(false);UI.closeModal();return}
    if(typing)return;
    if(e.key==='/'){e.preventDefault();Shell.togglePalette(true)}
    else if(e.key.toLowerCase()==='a'){Shell.toggleLauncher(true)}
    else if(e.key===' '){e.preventDefault();CLOCK.toggle();APP.rerender()}
    else if(e.key==='ArrowLeft'){CLOCK.setHour(CLOCK.hour()-1);APP.rerender()}
    else if(e.key==='ArrowRight'){CLOCK.setHour(CLOCK.hour()+1);APP.rerender()}
    else if(e.key.toLowerCase()==='r'){APP.rightOpen=!APP.rightOpen;APP.rerender()}
    else if(e.key.toLowerCase()==='t'){APP.railOpen=!APP.railOpen;APP.rerender()}
    else if(e.key>='1'&&e.key<='5'){
      const scr=SCREENS[APP.module];
      const i=Number(e.key)-1;
      if(scr&&scr[i])APP.go(scr[i].id);
    }
  });

  window.addEventListener('hashchange',()=>{
    const hh=location.hash.replace('#/','');
    const parts=hh.split('/');
    const scr=(parts[1]||'').toUpperCase();
    const mod=scr.split('-')[0];
    if(SCREENS[mod]&&APP.screen!==scr)APP.go(scr);
  });

  // mensagem de abertura
  setTimeout(()=>{
    UI.toast('Ambiente de demonstração',
      'Cenário SIM-FLOOD-RS-2026-001 · seed 20260823. Toda saída é simulada. Use Ctrl+K para navegar e a barra de espaço para pausar o relógio.','ai');
  },900);
  setTimeout(()=>{
    BUS.emit('incident.level.changed',{},
      {text:'Sessão iniciada em <b>h+'+fmt(CLOCK.hour(),1)+'</b> do cenário — evento em nível 4, fase de resposta',sev:'critico',mod:'M0'});
  },1600);
  setTimeout(()=>{
    if(MAPS.isFailed())UI.toast('Motor raster assumiu o mapa',
      'O ArcGIS Maps SDK não iniciou neste contexto. O mapa segue navegável — clique no rótulo do motor, no painel de camadas, para ver o diagnóstico.','warn');
  },7000);
})();
</script>
