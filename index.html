<script>
/* ============================================================================
   GRÁFICOS SVG — sem dependências externas
   ========================================================================== */
const CH=(()=>{
  const P={l:38,r:10,t:10,b:20};
  function scale(d0,d1,r0,r1){const s=(r1-r0)/((d1-d0)||1);return v=>r0+(v-d0)*s}
  function axis(W,H,xs,ys,xt,yt,opt){
    opt=opt||{};let s='';
    (yt||[]).forEach(t=>{const y=ys(t);
      s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="#1C3243" stroke-width="1"/>`;
      s+=`<text x="${P.l-5}" y="${y+3}" text-anchor="end" font-size="9" fill="#4E6673" font-family="IBM Plex Mono">${opt.yfmt?opt.yfmt(t):fmt(t,opt.yd==null?0:opt.yd)}</text>`;});
    (xt||[]).forEach(t=>{const x=xs(t.v!=null?t.v:t);
      s+=`<text x="${x}" y="${H-P.b+12}" text-anchor="middle" font-size="9" fill="#4E6673" font-family="IBM Plex Mono">${t.l!=null?t.l:t}</text>`;
      if(opt.xgrid)s+=`<line x1="${x}" x2="${x}" y1="${P.t}" y2="${H-P.b}" stroke="#132330" stroke-width="1"/>`;});
    return s;
  }
  function path(pts,xs,ys){if(!pts||!pts.length)return '';
    return pts.map((p,i)=>(i?'L':'M')+xs(p[0]).toFixed(1)+' '+ys(p[1]).toFixed(1)).join(' ')}
  function area(pts,xs,ys,base){if(!pts||!pts.length)return '';
    return path(pts,xs,ys)+` L${xs(pts[pts.length-1][0]).toFixed(1)} ${ys(base).toFixed(1)} L${xs(pts[0][0]).toFixed(1)} ${ys(base).toFixed(1)} Z`}
  function maxOf(arr,f,dflt){if(!arr||!arr.length)return dflt;
    let m=-Infinity;arr.forEach(x=>{const v=f(x);if(isFinite(v)&&v>m)m=v});return isFinite(m)?m:dflt}

  /* Hidrograma com faixa de ensemble, hietograma invertido e limiares */
  function hydro(o){
    const W=o.w||600,H=o.h||220;
    const xs=scale(o.x0,o.x1,P.l,W-P.r);
    const hasLine=!!(o.line&&o.line.length), hasRain=!!(o.rain&&o.rain.length);
    const ymax=o.ymax||maxOf(o.line,p=>p[1],1)*1.18||1;
    const ys=scale(0,ymax,H-P.b,P.t+(hasRain?52:0));
    const yr=hasRain?scale(0,maxOf(o.rain,p=>p[1],1)*1.35||1,P.t+48,P.t):null;
    const yt=[];for(let i=0;i<=4;i++)yt.push(ymax*i/4);
    const xt=[];for(let i=o.x0;i<=o.x1;i+=(o.xstep||12))xt.push({v:i,l:(o.xlab?o.xlab(i):i+'h')});
    let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block">`;
    s+=`<defs><linearGradient id="gH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#19D3E8" stop-opacity=".38"/><stop offset="100%" stop-color="#19D3E8" stop-opacity="0"/></linearGradient>
      <linearGradient id="gE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9D7BFF" stop-opacity=".26"/><stop offset="100%" stop-color="#9D7BFF" stop-opacity=".05"/></linearGradient></defs>`;
    s+=axis(W,H,xs,ys,xt,yt,{yd:o.yd==null?1:o.yd,xgrid:true});
    if(o.band&&o.band.length){const up=o.band.map(p=>[p[0],p[2]]),lo=o.band.map(p=>[p[0],p[1]]).reverse();
      s+=`<path d="${path(up,xs,ys)} ${lo.map((p,i)=>'L'+xs(p[0]).toFixed(1)+' '+ys(p[1]).toFixed(1)).join(' ')} Z" fill="url(#gE)" stroke="#9D7BFF" stroke-width=".7" stroke-opacity=".55"/>`;}
    (o.thresholds||[]).forEach(t=>{const y=ys(t.v);
      s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="${t.c}" stroke-width="1" stroke-dasharray="4 3" opacity=".85"/>`;
      s+=`<text x="${W-P.r-2}" y="${y-3}" text-anchor="end" font-size="8.5" fill="${t.c}" font-family="Barlow Condensed" letter-spacing="1">${esc(t.l)}</text>`;});
    if(hasRain){const bw=Math.max(1.2,(W-P.l-P.r)/o.rain.length-1);
      o.rain.forEach(p=>{const h=Math.max(0,P.t+48-yr(p[1]));
        s+=`<rect x="${(xs(p[0])-bw/2).toFixed(1)}" y="${yr(p[1]).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="#35B8F0" opacity=".55"/>`;});
      s+=`<text x="${P.l+2}" y="${P.t+9}" font-size="8.5" fill="#35B8F0" font-family="Barlow Condensed" letter-spacing="1.4">CHUVA AREAL mm/h</text>`;}
    if(o.pred&&o.pred.length)s+=`<path d="${path(o.pred,xs,ys)}" fill="none" stroke="#9D7BFF" stroke-width="1.6" stroke-dasharray="5 3"/>`;
    if(hasLine){s+=`<path d="${area(o.line,xs,ys,0)}" fill="url(#gH)"/>`;
      s+=`<path d="${path(o.line,xs,ys)}" fill="none" stroke="#19D3E8" stroke-width="2"/>`;}
    else s+=`<text x="${W/2}" y="${(H)/2}" text-anchor="middle" font-size="10" fill="#4E6673" font-family="Barlow Condensed" letter-spacing="1.6">SEM DADOS NA JANELA SELECIONADA</text>`;
    if(o.now!=null){const x=xs(o.now);
      s+=`<line x1="${x}" x2="${x}" y1="${P.t}" y2="${H-P.b}" stroke="#fff" stroke-width="1" opacity=".55"/>`;
      s+=`<circle cx="${x}" cy="${P.t+3}" r="2.6" fill="#fff"/>`;}
    (o.marks||[]).forEach(m=>{const x=xs(m.x);
      s+=`<line x1="${x}" x2="${x}" y1="${P.t}" y2="${H-P.b}" stroke="${m.c}" stroke-width="1" stroke-dasharray="2 3" opacity=".8"/>`;
      s+=`<text x="${x+3}" y="${P.t+(m.dy||12)}" font-size="8.5" fill="${m.c}" font-family="Barlow Condensed" letter-spacing="1">${esc(m.l)}</text>`;});
    return s+'</svg>';
  }

  function lines(o){
    const W=o.w||480,H=o.h||180;
    const series=(o.series||[]).filter(s=>s&&s.pts&&s.pts.length);
    const all=series.flatMap(s=>s.pts);
    const x0=o.x0!=null?o.x0:(all.length?Math.min(...all.map(p=>p[0])):0);
    const x1=o.x1!=null?o.x1:(all.length?Math.max(...all.map(p=>p[0])):1);
    const y0=o.y0!=null?o.y0:(all.length?Math.min(0,...all.map(p=>p[1])):0);
    const y1=o.y1!=null?o.y1:(maxOf(all,p=>p[1],1)*1.12||1);
    const xs=scale(x0,x1,P.l,W-P.r), ys=scale(y0,y1,H-P.b,P.t);
    const yt=[];for(let i=0;i<=4;i++)yt.push(y0+(y1-y0)*i/4);
    const xt=o.xt||[{v:x0,l:fmt0(x0)},{v:(x0+x1)/2,l:fmt0((x0+x1)/2)},{v:x1,l:fmt0(x1)}];
    let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block">`;
    s+=axis(W,H,xs,ys,xt,yt,{yd:o.yd==null?1:o.yd});
    series.forEach(se=>{
      if(se.fill)s+=`<path d="${area(se.pts,xs,ys,y0)}" fill="${se.c}" opacity=".14"/>`;
      s+=`<path d="${path(se.pts,xs,ys)}" fill="none" stroke="${se.c}" stroke-width="${se.w||1.7}" ${se.dash?'stroke-dasharray="5 3"':''}/>`;
      if(se.dots)se.pts.forEach(p=>s+=`<circle cx="${xs(p[0]).toFixed(1)}" cy="${ys(p[1]).toFixed(1)}" r="2.2" fill="${se.c}"/>`);
    });
    if(o.now!=null){const x=xs(o.now);s+=`<line x1="${x}" x2="${x}" y1="${P.t}" y2="${H-P.b}" stroke="#fff" stroke-width="1" opacity=".5"/>`;}
    return s+'</svg>';
  }

  function bars(o){
    const W=o.w||440,H=o.h||170;
    if(!o.data||!o.data.length)return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block"><text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="10" fill="#4E6673" font-family="Barlow Condensed" letter-spacing="1.6">SEM DADOS</text></svg>`;
    const max=o.max||maxOf(o.data,d=>d.v,1)*1.15||1;
    const n=o.data.length, bw=(W-P.l-P.r)/n*0.72;
    const ys=scale(0,max,H-P.b,P.t);
    const yt=[];for(let i=0;i<=3;i++)yt.push(max*i/3);
    let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block">`;
    yt.forEach(t=>{const y=ys(t);
      s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="#1C3243"/>`;
      s+=`<text x="${P.l-5}" y="${y+3}" text-anchor="end" font-size="9" fill="#4E6673" font-family="IBM Plex Mono">${fmt(t,o.yd==null?0:o.yd)}</text>`;});
    o.data.forEach((d,i)=>{
      const x=P.l+(W-P.l-P.r)*(i+0.5)/n, h=Math.max(1,(H-P.b)-ys(d.v));
      s+=`<rect x="${(x-bw/2).toFixed(1)}" y="${ys(d.v).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${d.c||'#35B8F0'}" opacity=".88" rx="1"/>`;
      if(o.labels!==false)s+=`<text x="${x.toFixed(1)}" y="${H-P.b+12}" text-anchor="middle" font-size="8.5" fill="#4E6673" font-family="Barlow Condensed" letter-spacing=".5">${esc(d.l)}</text>`;
      if(o.values)s+=`<text x="${x.toFixed(1)}" y="${(ys(d.v)-3).toFixed(1)}" text-anchor="middle" font-size="9" fill="#AEC6D6" font-family="IBM Plex Mono">${fmt(d.v,o.vd==null?0:o.vd)}</text>`;
    });
    return s+'</svg>';
  }

  function hbars(o){
    const rows=o.data||[]; if(!rows.length)return '<div class="tiny faint">sem dados</div>';
    const max=maxOf(rows,d=>d.v,1)||1;
    return rows.map(d=>`<div style="display:grid;grid-template-columns:${o.lw||120}px 1fr ${o.vw||54}px;gap:7px;align-items:center;margin-bottom:4px">
      <div style="font-size:10.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(d.l)}">${esc(d.l)}</div>
      <div class="bar"><i style="width:${(d.v/max*100).toFixed(1)}%;background:${d.c||'var(--info)'}"></i></div>
      <div class="mono" style="font-size:10px;text-align:right;color:var(--ink)">${d.t!=null?d.t:fmt(d.v,o.vd==null?0:o.vd)}</div>
    </div>`).join('');
  }

  function donut(o){
    const S=o.size||118, R=S/2-9, C=S/2, tot=o.data.reduce((s,d)=>s+d.v,0)||1;
    let a=-Math.PI/2, s=`<svg viewBox="0 0 ${S} ${S}" style="width:${S}px;height:${S}px;display:block">`;
    o.data.forEach(d=>{
      const ang=d.v/tot*Math.PI*2, a2=a+ang, large=ang>Math.PI?1:0;
      const x1=C+Math.cos(a)*R,y1=C+Math.sin(a)*R,x2=C+Math.cos(a2)*R,y2=C+Math.sin(a2)*R;
      s+=`<path d="M${x1.toFixed(2)} ${y1.toFixed(2)} A${R} ${R} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}" fill="none" stroke="${d.c}" stroke-width="11"/>`;
      a=a2;});
    s+=`<text x="${C}" y="${C-1}" text-anchor="middle" font-size="20" fill="#DCEAF3" font-family="Barlow Condensed" font-weight="700">${esc(o.center||fmt0(tot))}</text>`;
    if(o.sub)s+=`<text x="${C}" y="${C+13}" text-anchor="middle" font-size="8.5" fill="#75919F" font-family="Barlow Condensed" letter-spacing="1.5">${esc(o.sub)}</text>`;
    return s+'</svg>';
  }

  function gauge(o){
    const W=o.w||150,H=88,C=W/2,R=58;
    const v=clamp((o.v-o.min)/((o.max-o.min)||1),0,1);
    const a0=Math.PI,a1=0,a=a0+(a1-a0)*v;
    function pt(ang,r){return [C+Math.cos(ang)*r,H-8+Math.sin(ang)*r]}
    const p0=pt(a0,R),p1=pt(a1,R),pv=pt(a,R);
    let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block">`;
    s+=`<path d="M${p0[0].toFixed(1)} ${p0[1].toFixed(1)} A${R} ${R} 0 0 1 ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}" fill="none" stroke="#1C3243" stroke-width="9"/>`;
    s+=`<path d="M${p0[0].toFixed(1)} ${p0[1].toFixed(1)} A${R} ${R} 0 ${v>0.5?1:0} 1 ${pv[0].toFixed(1)} ${pv[1].toFixed(1)}" fill="none" stroke="${o.c||'#19D3E8'}" stroke-width="9" stroke-linecap="round"/>`;
    s+=`<text x="${C}" y="${H-16}" text-anchor="middle" font-size="24" fill="#DCEAF3" font-family="Barlow Condensed" font-weight="700">${esc(o.label||fmt(o.v,1))}</text>`;
    s+=`<text x="${C}" y="${H-4}" text-anchor="middle" font-size="8.5" fill="#75919F" font-family="Barlow Condensed" letter-spacing="1.6">${esc(o.sub||'')}</text>`;
    return s+'</svg>';
  }

  function scatter(o){
    const W=o.w||330,H=o.h||220;
    const pts=o.pts||[];
    const x1=o.x1||maxOf(pts,p=>p[0],1)*1.1||1, y1=o.y1||maxOf(pts,p=>p[1],1)*1.1||1;
    const xs=scale(0,x1,P.l,W-P.r), ys=scale(0,y1,H-P.b,P.t);
    const yt=[];for(let i=0;i<=4;i++)yt.push(y1*i/4);
    const xt=[];for(let i=0;i<=4;i++)xt.push({v:x1*i/4,l:fmt0(x1*i/4)});
    let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block">`;
    s+=axis(W,H,xs,ys,xt,yt,{yd:0});
    s+=`<line x1="${xs(0)}" y1="${ys(0)}" x2="${xs(Math.min(x1,y1))}" y2="${ys(Math.min(x1,y1))}" stroke="#4E6673" stroke-dasharray="4 3"/>`;
    pts.forEach(p=>s+=`<circle cx="${xs(p[0]).toFixed(1)}" cy="${ys(p[1]).toFixed(1)}" r="3" fill="${p[2]||'#19D3E8'}" opacity=".8"/>`);
    return s+'</svg>';
  }

  function spark(pts,c,w,h){
    w=w||88;h=h||24;
    if(!pts||pts.length<2)return `<svg viewBox="0 0 ${w} ${h}" style="width:${w}px;height:${h}px;display:block"></svg>`;
    const y0=Math.min(...pts),y1=Math.max(...pts)||1;
    const xs=i=>i/(pts.length-1)*w, ys=v=>h-2-((v-y0)/((y1-y0)||1))*(h-4);
    const d=pts.map((v,i)=>(i?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1)).join(' ');
    return `<svg viewBox="0 0 ${w} ${h}" style="width:${w}px;height:${h}px;display:block"><path d="${d}" fill="none" stroke="${c||'#19D3E8'}" stroke-width="1.4"/></svg>`;
  }

  function heat(o){
    const cols=o.cols,rows=o.rows,cw=o.cw||22,ch=o.ch||17;
    let s=`<div style="display:inline-block"><div style="display:grid;grid-template-columns:${o.lw||88}px repeat(${cols.length},${cw}px);gap:1px">`;
    s+=`<div></div>`+cols.map(c=>`<div style="font-size:8px;color:var(--faint);text-align:center;font-family:var(--mono)">${esc(c)}</div>`).join('');
    rows.forEach(r=>{
      s+=`<div style="font-size:10px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(r.l)}">${esc(r.l)}</div>`;
      r.v.forEach((v,i)=>{const c=o.color(v);
        s+=`<div title="${esc(r.l)} · ${esc(cols[i])}: ${fmt(v,1)}" style="height:${ch}px;background:${c};border-radius:1px"></div>`;});
    });
    return s+'</div></div>';
  }
  return {hydro,lines,bars,hbars,donut,gauge,scatter,spark,heat};
})();

/* ============================================================================
   COMPONENTES DE UI
   ========================================================================== */
const UI=(()=>{
  function toast(t,m,k){
    const w=$('#toasts'); if(!w)return;
    const n=el('div',{class:'toast '+(k||'')},`<div class="tt">${esc(t)}</div><div class="dim">${m||''}</div>`);
    w.appendChild(n);setTimeout(()=>{n.style.opacity='0';n.style.transform='translateX(18px)';setTimeout(()=>n.remove(),260)},4600);
  }
  function modal(title,bodyHTML,footHTML,w){
    const wrap=$('#modalwrap');
    wrap.innerHTML=`<div class="modal" style="${w?'max-width:'+w+'px':''}">
      <div class="mh"><h3>${esc(title)}</h3><div style="margin-left:auto"><button class="btn btn-sm" id="mclose">Fechar</button></div></div>
      <div class="mb">${bodyHTML}</div>${footHTML?`<div class="mf">${footHTML}</div>`:''}</div>`;
    wrap.classList.add('on');
    $('#mclose').onclick=closeModal;
    wrap.onclick=e=>{if(e.target===wrap)closeModal()};
  }
  function closeModal(){$('#modalwrap').classList.remove('on');$('#modalwrap').innerHTML=''}

  function kpi(o){
    const c=sevColor(o.sev||'info');
    const ticks=[15,32,50,68,85].map(p=>`<i style="top:${p}%"></i>`).join('');
    const mark=o.mark!=null?`<b style="top:${clamp(100-o.mark,3,96)}%"></b>`:'';
    return `<div class="kpi" style="color:${c}">
      <div class="rule">${ticks}${mark}</div>
      <div class="kl">${esc(o.label)}</div>
      <div class="kv" style="color:${o.plain?'var(--ink)':c}">${o.value}<span class="ku">${o.unit||''}</span></div>
      <div class="kd">${o.trend?`<span class="trend ${o.trendDir||'flat'}">${esc(o.trend)}</span>`:''}${o.desc?`<span>${o.desc}</span>`:''}</div>
      ${o.foot?`<div class="tiny faint mono" style="margin-top:4px">${esc(o.foot)}</div>`:''}
    </div>`;
  }

  /* Tabela com ordenação, filtro e seleção */
  const tblState={};
  function table(o){
    const key=o.key||'t';
    tblState[key]=tblState[key]||{sort:o.sort||null,dir:1,q:''};
    const st=tblState[key];
    const id='tbl_'+key.replace(/\W/g,'');
    setTimeout(()=>{
      const root=document.getElementById(id); if(!root)return;
      $$('th',root).forEach(th=>th.onclick=()=>{
        const k=th.dataset.k; if(!k)return;
        if(st.sort===k)st.dir*=-1;else{st.sort=k;st.dir=1}
        APP.rerender();
      });
      const qi=$('#q_'+id); if(qi)qi.oninput=debounce(e=>{st.q=e.target.value;APP.rerender()},220);
      $$('tbody tr',root).forEach(tr=>tr.onclick=()=>{
        const r=o.rows[Number(tr.dataset.i)];
        APP.selected={type:o.entity||'row',data:r,cols:o.cols};
        APP.rightTab='detail'; APP.rerender();
        if(o.onSelect)o.onSelect(r);
      });
    },0);
    let rows=o.rows.slice();
    if(st.q){const q=st.q.toLowerCase();rows=rows.filter(r=>o.cols.some(c=>String(c.get?c.get(r):r[c.k]||'').toLowerCase().includes(q)))}
    if(st.sort){const c=o.cols.find(c=>c.k===st.sort);
      if(c)rows.sort((a,b)=>{const va=c.raw?c.raw(a):(c.get?c.get(a):a[c.k]),vb=c.raw?c.raw(b):(c.get?c.get(b):b[c.k]);
        if(typeof va==='number'&&typeof vb==='number')return (va-vb)*st.dir;
        return String(va).localeCompare(String(vb),'pt-BR')*st.dir});}
    const sel=APP.selected&&APP.selected.data;
    return `<div id="${id}">
      ${o.noTools?'':`<div class="tbl-tools">
        <input class="inp" id="q_${id}" placeholder="Filtrar ${o.rows.length} registros…" value="${esc(st.q)}" style="width:200px">
        ${o.tools||''}
        <span class="tiny faint" style="margin-left:auto">${rows.length} de ${o.rows.length}${o.src?' · '+esc(o.src):''}</span>
      </div>`}
      <div class="tbl-wrap" style="${o.maxh?'max-height:'+o.maxh+'px':''}">
      <table class="tbl"><thead><tr>${o.cols.map(c=>
        `<th data-k="${c.k}" style="${c.w?'width:'+c.w:''}">${esc(c.t)}${st.sort===c.k?`<span class="ar"> ${st.dir>0?'▲':'▼'}</span>`:''}</th>`).join('')}</tr></thead>
      <tbody>${rows.length?rows.map((r,i)=>`<tr data-i="${o.rows.indexOf(r)}" class="${sel===r?'sel':''}">${
        o.cols.map(c=>`<td class="${c.cls||''}">${c.get?c.get(r):esc(r[c.k])}</td>`).join('')}</tr>`).join('')
        :`<tr><td colspan="${o.cols.length}">${state('Nenhum registro','Ajuste o filtro ou amplie a janela temporal.','∅')}</td></tr>`}
      </tbody></table></div></div>`;
  }

  function state(t,d,ic){return `<div class="state"><div class="ic">${ic||'◇'}</div><div class="t">${esc(t)}</div><div>${esc(d||'')}</div></div>`}
  function loading(t){return `<div class="state"><div class="skel" style="width:150px"></div><div class="t">${esc(t||'Carregando…')}</div></div>`}

  /* Construtor de formulário */
  function form(o){
    const fid='frm_'+(o.key||'x');
    setTimeout(()=>{
      const f=document.getElementById(fid); if(!f)return;
      $$('.chk',f).forEach(c=>c.onclick=()=>c.classList.toggle('on'));
      const btn=$('#'+fid+'_submit'); if(btn)btn.onclick=()=>{
        let ok=true; const vals={};
        o.groups.forEach(g=>g.fields.forEach(fl=>{
          const n=f.querySelector('[name="'+fl.n+'"]');
          const wrap=n?n.closest('.fld'):null;
          const v=n?(n.value||'').trim():'';
          vals[fl.n]=v;
          if(wrap)wrap.classList.remove('err');
          if(fl.req&&!v&&wrap){wrap.classList.add('err');ok=false}
        }));
        $$('.chk.on',f).forEach(c=>{vals[c.dataset.g]=(vals[c.dataset.g]||[]);vals[c.dataset.g].push(c.dataset.v)});
        if(!ok){toast('Campos obrigatórios','Preencha os campos destacados antes de continuar.','err');return}
        o.onSubmit(vals);
      };
    },0);
    return `<form class="form" id="${fid}" onsubmit="return false">
      ${o.groups.map(g=>`<fieldset class="fset"><div class="fset-h">${esc(g.t)}</div><div class="fset-b">
        ${g.rows?g.rows.map(r=>`<div class="frow c${r.length}">${r.map(n=>fld(g.fields.find(f=>f.n===n))).join('')}</div>`).join('')
          :g.fields.map(f=>fld(f)).join('')}
      </div></fieldset>`).join('')}
      <div class="flexr" style="justify-content:flex-end">
        ${o.note?`<span class="tiny faint" style="margin-right:auto;max-width:520px">${o.note}</span>`:''}
        <button class="btn btn-p" id="${fid}_submit">${esc(o.submit||'Salvar')}</button>
      </div></form>`;
  }
  function fld(f){
    if(!f)return '';
    let inner;
    if(f.type==='select')inner=`<select class="inp" name="${f.n}">${f.opts.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`;
    else if(f.type==='textarea')inner=`<textarea class="inp" name="${f.n}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}">${esc(f.val||'')}</textarea>`;
    else if(f.type==='chips')inner=`<div class="chks">${f.opts.map(o=>`<div class="chk ${f.on&&f.on.includes(o)?'on':''}" data-g="${f.n}" data-v="${esc(o)}">${esc(o)}</div>`).join('')}</div>`;
    else if(f.type==='static')inner=`<div class="inp" style="display:flex;align-items:center;color:var(--muted)">${f.val||''}</div>`;
    else inner=`<input class="inp" name="${f.n}" type="${f.type||'text'}" placeholder="${esc(f.ph||'')}" value="${esc(f.val||'')}">`;
    return `<div class="fld"><label>${esc(f.t)}${f.req?' <span class="req">*</span>':''}</label>${inner}
      ${f.hint?`<div class="hint">${f.hint}</div>`:''}<div class="emsg">Campo obrigatório para prosseguir.</div></div>`;
  }

  function card(t,body,o){
    o=o||{};
    return `<div class="card ${o.cls||''}" style="${o.style||''}">
      <div class="card-h"><h3>${esc(t)}</h3>${o.sub?`<span class="sub">${o.sub}</span>`:''}${o.right?`<div class="r">${o.right}</div>`:''}</div>
      <div class="card-b ${o.tight?'tight':''}" style="${o.bstyle||''}">${body}</div>
      ${o.foot?`<div class="card-f">${o.foot}</div>`:''}</div>`;
  }
  function srcFoot(src,ts,cls){
    return `<span class="src">fonte: ${esc(src)}</span><span class="src">t: ${ts||stamp(CLOCK.date())}</span>
      ${cls?`<span class="cls cls-${cls}" title="Classe de confiança ${cls}">${cls}</span>`:''}
      <span class="badge b-modelado" style="margin-left:auto">simulação</span>`;
  }
  function badge(t,k){return `<span class="badge ${sevClass(k)}">${esc(t)}</span>`}
  function clsBadge(c){return `<span class="cls cls-${c}" title="Classe de confiança ${c}">${c}</span>`}
  function pill(t,c){return `<span class="badge" style="border-color:${c};color:${c};background:transparent">${esc(t)}</span>`}
  function statusDot(s){
    const c={online:'var(--normal)',ok:'var(--normal)',atrasada:'var(--atencao)',atencao:'var(--atencao)',
      degradado:'var(--alerta)',suspeita:'var(--alerta)',offline:'var(--critico)',bloqueado:'var(--critico)',
      lacuna:'var(--critico)',idle:'var(--semdados)'}[s]||'var(--semdados)';
    return `<span class="dot" style="background:${c}"></span>`;
  }
  function prog(p,c){return `<div class="prog"><i style="width:${clamp(p,0,100)}%;${c?'background:'+c:''}"></i></div>`}
  return {toast,modal,closeModal,kpi,table,state,loading,form,card,srcFoot,badge,clsBadge,pill,statusDot,prog,fld};
})();
</script>
<script>
/* ============================================================================
   PLATAFORMA GEOESPACIAL
   Motor primário: ArcGIS Maps SDK for JavaScript.
   Motor secundário: mapa raster interativo próprio (pan/zoom real), usado
   quando o SDK não pode inicializar — típico em páginas publicadas cujo CSP
   não libera wasm-unsafe-eval / worker-src blob:, ou em iframes de origem opaca.
   A chave ArcGIS nunca é embutida: informada em tempo de execução, só em memória.
   ========================================================================== */
const MAPS=(()=>{
  let sdk=null, view=null, map=null, ready=false;
  let L={}; let host=null, cfgAtual=null, lastFrame=-1, swipeW=null, viewHost=null;
  const visUser={};              // camadas ligadas/desligadas pelo operador — sobrepõem o padrão da tela
  let tool='identify';           // identify | pan
  let painelPref=null;           // null = automático pela largura da tela; true/false = escolha do operador
  function telaEstreita(){return (typeof window!=='undefined'&&window.innerWidth)?window.innerWidth<1180:false}
  function panelsOpen(){return painelPref!=null?painelPref:!telaEstreita()}
  function togglePanels(){painelPref=!panelsOpen();APP.rerender()}
  let baseLayers=null;           // conjunto declarado pela tela atual
  function effectiveVis(base){
    if(base)baseLayers=base.slice();
    const set=new Set(baseLayers||LAYERS.filter(l=>l.on).map(l=>l.id));
    Object.keys(visUser).forEach(id=>{ if(visUser[id])set.add(id); else set.delete(id) });
    LAYERS.forEach(l=>l.on=set.has(l.id));
    return set;
  }
  let engine='loading';                 // loading | arcgis | raster
  const waiters=[]; const diag=[];
  let wdView=null, wdArmado=false;

  function note(kind,msg){diag.push({t:new Date(),kind,msg});if(diag.length>40)diag.shift()}
  function clearWatchdogs(){if(wdView)clearTimeout(wdView);wdView=null}
  /* O MapView do ArcGIS só inicializa depois que o contêiner está anexado ao
     documento e tem dimensão. Contar o tempo antes disso mede a navegação do
     operador, não a saúde do SDK. */
  function armarWatchdog(){
    if(wdArmado||ready||engine==='raster')return;
    wdArmado=true;
    wdView=setTimeout(()=>degrade('MapView não inicializou em 30 s com o contêiner já visível'),30000);
  }

  /* ---------- degradação controlada ---------- */
  function degrade(reason){
    if(engine==='raster')return;
    clearWatchdogs();
    engine='raster'; ready=false;
    note('degrade',reason);
    LAYERS.forEach(l=>{if(l.url)LAYER_HEALTH[l.id]={status:'offline',ms:null,
      msg:'não avaliada — o mapa passou para o motor raster ('+reason+')'}});
    BUS.emit('integration.sla.breached',{},
      {text:`ArcGIS Maps SDK indisponível (${esc(reason)}) — motor raster assumiu o mapa`,sev:'atencao',mod:'M17'});
    waiters.splice(0).forEach(f=>{try{f(null)}catch(e){}});
    if(host)mount(host,cfgAtual);
    APP.rerender();
  }

  /* ---------- resolução do SDK (script estático no <head>, padrão AMD) ------
     O script é declarado estaticamente no documento. Injetar <script> em tempo
     de execução é o que falhava em páginas publicadas: além do CSP, o loader
     Dojo perde a URL base. Aqui apenas resolvemos os módulos do loader global. */
  const ARCGIS_ONLINE='https://services.arcgisonline.com/ArcGIS/rest/services/';
  const BASEMAPS={
    dark:{n:'Esri · World Dark Gray Canvas',base:ARCGIS_ONLINE+'Canvas/World_Dark_Gray_Base/MapServer',
          ref:ARCGIS_ONLINE+'Canvas/World_Dark_Gray_Reference/MapServer'},
    imagery:{n:'Esri · World Imagery',base:ARCGIS_ONLINE+'World_Imagery/MapServer',
          ref:ARCGIS_ONLINE+'Reference/World_Boundaries_and_Places/MapServer'},
    terrain:{n:'Esri · World Terrain',base:ARCGIS_ONLINE+'World_Terrain_Base/MapServer',
          ref:ARCGIS_ONLINE+'Reference/World_Boundaries_and_Places/MapServer'},
    topo:{n:'Esri · World Topographic',base:ARCGIS_ONLINE+'World_Topo_Map/MapServer'}
  };
  let basemapId='dark';

  function esriReady(){
    return new Promise((res,rej)=>{
      if(sdk)return res(sdk);
      if(typeof window.require==='undefined')
        return rej(new Error('ArcGIS Maps SDK indisponível — script da CDN não carregou'));
      let done=false;
      const to=setTimeout(()=>{if(!done){done=true;rej(new Error('módulos do SDK não resolveram em 20 s'))}},20000);
      try{
        window.require(['esri/config','esri/Map','esri/Basemap','esri/views/MapView','esri/layers/TileLayer',
          'esri/layers/MapImageLayer','esri/layers/FeatureLayer','esri/layers/GraphicsLayer','esri/Graphic',
          'esri/widgets/ScaleBar','esri/widgets/Swipe',
          'esri/rest/identify','esri/rest/support/IdentifyParameters'],
        (esriConfig,Map,Basemap,MapView,TileLayer,MapImageLayer,FeatureLayer,GraphicsLayer,Graphic,ScaleBar,Swipe,
         identifyRest,IdentifyParameters)=>{
          if(done)return; done=true; clearTimeout(to);
          sdk={esriConfig,Map,Basemap,MapView,TileLayer,MapImageLayer,FeatureLayer,GraphicsLayer,Graphic,ScaleBar,Swipe,
               identifyRest,IdentifyParameters};
          note('sdk','módulos resolvidos');
          res(sdk);
        },err=>{if(done)return;done=true;clearTimeout(to);rej(err||new Error('falha ao resolver módulos'))});
      }catch(err){if(!done){done=true;clearTimeout(to);rej(err)}}
    });
  }

  function basemapFrom(M,id){
    const b=BASEMAPS[id]||BASEMAPS.dark;
    const layers=[new M.TileLayer({url:b.base})];
    if(b.ref)layers.push(new M.TileLayer({url:b.ref}));
    return new M.Basemap({baseLayers:layers,title:b.n});
  }
  function setBasemap(id){
    basemapId=id;
    if(ready&&map){try{map.basemap=basemapFrom(sdk,id)}catch(e){}}
    APP.rerender();
  }

  function buildMap(){
    const M=sdk, {esriConfig,Map,MapView,TileLayer,MapImageLayer,FeatureLayer,GraphicsLayer,ScaleBar}=M;
    try{esriConfig.request.timeout=30000}catch(e){}

    map=new Map({basemap:basemapFrom(M,basemapId)});

    LAYERS.filter(l=>l.url).forEach(cfg=>{
      let lyr;
      const common={id:cfg.id,title:cfg.nome,visible:!!cfg.on,opacity:cfg.id==='LY-IMG'?1:.85};
      try{
        if(cfg.tipo==='tile')lyr=new TileLayer(Object.assign({url:cfg.url},common));
        else if(cfg.tipo==='mapimage')lyr=new MapImageLayer(Object.assign({url:cfg.url},common));
        else if(cfg.tipo==='feature')lyr=new FeatureLayer(Object.assign({url:cfg.url,outFields:['*'],
          popupTemplate:{title:cfg.nome,content:[{type:'fields'}]}},common));
      }catch(e){LAYER_HEALTH[cfg.id]={status:'offline',ms:null,msg:'construção falhou'};return}
      if(!lyr)return;
      const t0=performance.now();
      LAYER_HEALTH[cfg.id]={status:'carregando',ms:null,msg:'requisitando serviço'};
      lyr.when(()=>{LAYER_HEALTH[cfg.id]={status:'ok',ms:Math.round(performance.now()-t0),msg:'serviço respondeu'};APP.rerender()},
        (err)=>{LAYER_HEALTH[cfg.id]={status:'offline',ms:Math.round(performance.now()-t0),
          msg:(cfg.url.indexOf('http://')===0?'bloqueio de conteúdo misto (http) — ':'')+'indisponível: '+((err&&err.name)||'erro')};
          BUS.emit('integration.sla.breached',{layer:cfg.id},
            {text:`Camada <b>${esc(cfg.nome)}</b> indisponível — fallback local ativado`,sev:'atencao',mod:'M17',ref:cfg.id});
          APP.rerender()});
      map.add(lyr);
    });

    ['LY-ENSO','LY-PREV','LY-OBS','LY-DIV','LY-AOI','LY-MUN','LY-REC','LY-REDE','LY-RSV'].forEach(id=>{
      const cfg=LAYERS.find(l=>l.id===id);
      L[id]=new GraphicsLayer({id,title:cfg.nome,visible:!!cfg.on});
      map.add(L[id]);
      LAYER_HEALTH[id]={status:'ok',ms:2,msg:'fixture local'};
    });

    // contêiner persistente: é movido entre as telas, nunca recriado
    viewHost=document.createElement('div');
    viewHost.className='esrimap';
    viewHost.style.cssText='position:absolute;inset:0';

    view=new MapView({container:viewHost,map,center:[-51.24,-30.03],zoom:9,
      constraints:{snapToZoom:false,minZoom:3,maxZoom:18,rotationEnabled:false},
      ui:{components:['zoom','attribution']},
      popup:{dockEnabled:false,collapseEnabled:false,defaultPopupTemplateEnabled:true}});

    view.when(()=>{
      clearTimeout(wdView); wdView=null;
      ready=true; engine='arcgis';
      note('sdk','MapView pronto · basemap '+BASEMAPS[basemapId].n);
      try{view.ui.add(new ScaleBar({view,unit:'metric',style:'line'}),'bottom-right')}catch(e){}
      try{view.popupEnabled=true}catch(e){}
      wireIdentify(view);
      drawLocal(true);
      waiters.splice(0).forEach(f=>{try{f(view)}catch(e){}});
      BUS.emit('integration.sla.breached',{},
        {text:`ArcGIS Maps SDK 4.30 inicializado · ${esc(BASEMAPS[basemapId].n)} · serviços públicos, sem chave`,sev:'normal',mod:'M17'});
      APP.rerender();
    },(err)=>degrade('MapView rejeitou: '+((err&&err.message)||'erro')));
  }

  /* Identify: o clique consulta as feições sob o cursor e leva o registro ao
     painel direito. O arraste continua sendo navegação — são gestos distintos. */
  const LOOKUP={
    'LY-REDE':a=>({type:'estacao',data:ESTACOES.find(e=>e.codigo===a['Código'])}),
    'LY-REC':a=>({type:'receptor',data:RECEPTORES.find(r=>r.nome===a['Receptor'])}),
    'LY-RSV':a=>({type:'reservatorio',data:RESERVATORIOS.find(r=>r.nome===a['Reservatório'])}),
    'LY-MUN':a=>({type:'municipio',data:MUNICIPIOS.find(m=>m.nome===a['Município'])})
  };
  function identifyGraphic(g){
    const lid=g.layer&&g.layer.id, a=g.attributes||{};
    let sel=null;
    if(LOOKUP[lid]){const r=LOOKUP[lid](a); if(r&&r.data)sel=r}
    if(!sel)sel={type:'feicao',data:a};
    APP.selected=sel; APP.rightTab='detail'; APP.rightOpen=true;
    BUS.emit('map.identify',{layer:lid},
      {text:`Identificação no mapa — <b>${esc(a['Estação']||a['Receptor']||a['Reservatório']||a['Município']||a['Camada']||lid||'feição')}</b>`,
       sev:'info',mod:APP.module});
    APP.rerender();
  }
  /* MapImageLayer é desenhada no servidor: hitTest não a enxerga. A consulta
     precisa ser um identify REST contra o MapServer, com tolerância em pixels. */
  function identifyServices(mapPoint,v){
    const alvo=LAYERS.filter(l=>(l.tipo==='mapimage')&&effectiveVis(null).has(l.id)&&
      (LAYER_HEALTH[l.id]||{}).status!=='offline');
    if(!alvo.length||!sdk.identifyRest||!sdk.IdentifyParameters)return Promise.resolve([]);
    return Promise.all(alvo.map(cfg=>{
      let params;
      try{
        params=new sdk.IdentifyParameters();
        params.geometry=mapPoint;
        params.mapExtent=v.extent;
        params.width=v.width; params.height=v.height;
        params.tolerance=8;
        params.layerOption='visible';
        params.returnGeometry=false;
        params.spatialReference=v.spatialReference;
      }catch(e){return Promise.resolve({cfg,erro:'parâmetros inválidos'})}
      return sdk.identifyRest.identify(cfg.url,params)
        .then(r=>({cfg,results:(r&&r.results)||[]}))
        .catch(err=>({cfg,erro:(err&&(err.details&&err.details.httpStatus?'HTTP '+err.details.httpStatus:err.message))||'serviço não respondeu'}));
    }));
  }

  function wireIdentify(v){
    v.on('click',ev=>{
      if(tool!=='identify')return;
      const p=ev.mapPoint;
      v.hitTest(ev).then(r=>{
        const g=(r.results||[]).map(x=>x.graphic).filter(x=>x&&x.layer&&x.layer.id)[0];
        if(g){identifyGraphic(g);return}
        if(!p)return;
        const alvos=LAYERS.filter(l=>l.tipo==='mapimage'&&effectiveVis(null).has(l.id));
        if(!alvos.length){mostraCoordenada(p,v);return}
        // consulta assíncrona aos MapServer da ANA/SNIRH
        APP.selected={type:'identify',loading:true,ponto:[p.longitude,p.latitude],
          consultando:alvos.map(a=>a.nome),grupos:[]};
        APP.rightTab='detail'; APP.rightOpen=true; APP.rerender();
        identifyServices(p,v).then(resp=>{
          const grupos=[];
          resp.forEach(rr=>{
            if(rr.erro){grupos.push({servico:rr.cfg.nome,fonte:rr.cfg.fonte,erro:rr.erro,itens:[]});return}
            const itens=(rr.results||[]).map(x=>({
              camada:x.layerName||('sublayer '+x.layerId),
              rotulo:x.value||x.displayFieldName||'',
              attrs:x.feature&&x.feature.attributes?x.feature.attributes:{}}));
            grupos.push({servico:rr.cfg.nome,fonte:rr.cfg.fonte,itens});
          });
          const n=grupos.reduce((a,g)=>a+g.itens.length,0);
          APP.selected={type:'identify',loading:false,ponto:[p.longitude,p.latitude],grupos};
          BUS.emit('map.identify',{},
            {text:`Identify nos serviços ANA/SNIRH — <b>${n}</b> feição(ões) no ponto ${fmt(p.latitude,4)}, ${fmt(p.longitude,4)}`,
             sev:n?'info':'atencao',mod:APP.module});
          APP.rerender();
        });
      }).catch(()=>{ if(p)mostraCoordenada(p,v) });
    });
    function mostraCoordenada(p,v2){
      APP.selected={type:'coordenada',data:{
        Longitude:fmt(p.longitude,5),Latitude:fmt(p.latitude,5),
        'Zoom':fmt(v2.zoom,1),'Instante':stamp(CLOCK.date()),
        'Camadas visíveis':Array.from(effectiveVis(null)).length,
        'Sistema de referência':'EPSG:4326 · WGS84'}};
      APP.rightTab='detail'; APP.rightOpen=true; APP.rerender();
    }
    let lastMove=0;
    v.on('pointer-move',ev=>{
      const now=Date.now(); if(now-lastMove<110)return; lastMove=now;
      if(tool!=='identify'){if(v.container)v.container.style.cursor='grab';return}
      v.hitTest(ev).then(r=>{
        const hit=(r.results||[]).some(x=>x.graphic&&x.graphic.layer&&x.graphic.layer.id);
        if(v.container)v.container.style.cursor=hit?'pointer':'crosshair';
      }).catch(()=>{});
    });
  }

  function boot(){
    note('sdk','resolvendo módulos do loader global (script estático 4.30)');
    esriReady().then(()=>{try{buildMap()}catch(e){degrade('erro ao construir o mapa: '+((e&&e.message)||e))}})
      .catch(err=>degrade((err&&err.message)||'SDK indisponível'));
  }

  /* ---------- camadas locais no modo ArcGIS ---------- */
  const SYM={
    prev:{type:'simple-fill',color:[157,123,255,.30],outline:{color:[157,123,255,.95],width:1.4}},
    obs:{type:'simple-fill',color:[53,184,240,.32],outline:{color:[25,211,232,1],width:1.6}},
    div:{type:'simple-fill',color:[255,74,95,.40],outline:{color:[255,74,95,1],width:1.4}},
    aoi:{type:'simple-fill',color:[25,211,232,.05],outline:{color:[25,211,232,.9],width:1.4,style:'dash'}}
  };
  function pt(color,size){return {type:'simple-marker',style:'circle',color,size:size||7,outline:{color:[6,13,19,.9],width:1}}}
  /* content como função: o autocast de '{*}' não monta tabela para graphics */
  function popupFor(titulo){
    return {title:titulo,outFields:['*'],content:(ev)=>{
      const a=(ev&&ev.graphic&&ev.graphic.attributes)||{};
      const tr=Object.keys(a).map(k=>`<tr><td style="padding:3px 8px 3px 0;color:#75919F;white-space:nowrap">${esc(k)}</td>
        <td style="padding:3px 0;color:#DCEAF3">${esc(String(a[k]))}</td></tr>`).join('');
      const d=document.createElement('div');
      d.innerHTML=`<table style="width:100%;border-collapse:collapse;font-size:12px;font-family:'IBM Plex Sans',system-ui">${tr}</table>`;
      return d;
    }};
  }
  function toPoly(rings){return {type:'polygon',rings:rings.map(r=>r.concat([r[0]])),spatialReference:{wkid:4326}}}
  function sevRGBA(s,a){
    const m={normal:[47,191,113],info:[53,184,240],atencao:[232,163,23],alerta:[255,133,52],critico:[255,74,95],modelado:[157,123,255]};
    return (m[s]||[85,112,126]).concat([a]);
  }
  /* Superfície de impacto do ENSO: redesenhada quando muda o modo, o
     trimestre ou os parâmetros do simulador — não a cada quadro do relógio. */
  let ensoAssinatura=null;
  function drawENSO(force){
    if(!ready||!sdk||!L['LY-ENSO'])return;
    if(typeof ENSO_GRID==='undefined')return;
    const st=statsENSO();
    const assin=[ENSOMAP.modo,ENSOUI.tri,ENSOMAP.usarSim,st.sev.toFixed(3),st.fat.toFixed(3)].join('|');
    if(!force&&assin===ensoAssinatura)return;
    ensoAssinatura=assin;
    const G=sdk.Graphic;
    L['LY-ENSO'].removeAll();
    ENSO_GRID.forEach(c=>{
      const v=valorCelula(c,ENSOMAP.modo,st.sev,st.fat);
      const op=opacENSO(v,ENSOMAP.modo);
      if(op<=0)return;
      const rgb=corENSO(v,ENSOMAP.modo);
      const anel=[[c.x,c.y],[c.x+c.p,c.y],[c.x+c.p,c.y+c.p],[c.x,c.y+c.p]];
      L['LY-ENSO'].add(new G({
        geometry:toPoly([anel]),
        symbol:{type:'simple-fill',color:rgb.concat([op]),outline:{width:0}},
        attributes:{
          Camada:'Impacto do El Niño — superfície interpolada',
          Modo:(ENSO_MODOS.find(m=>m.id===ENSOMAP.modo)||{}).nome,
          Trimestre:trimestre(ENSOUI.tri).nome,
          'Anomalia de chuva':fmt(c.anom*st.sev,1)+'%',
          'Índice (0–1)':fmt(Math.abs(v),2),
          'Exposição relativa':fmt(c.expo,2),
          'Aderência do sinal':fmt(c.skill,2),
          'Região dominante':(REGIOES.find(r=>r.id===c.rh)||{}).nome||'—',
          Natureza:'valor interpolado — não é medição pontual'
        },
        popupTemplate:popupFor('Impacto do El Niño')
      }));
    });
  }
  function drawLocal(force){
    if(!ready||!sdk)return;
    drawENSO(force);
    const f=frameNow();
    if(!force&&f.i===lastFrame)return;
    lastFrame=f.i;
    const G=sdk.Graphic;
    L['LY-PREV'].removeAll();
    L['LY-PREV'].add(new G({geometry:toPoly(f.prevRings),symbol:SYM.prev,
      attributes:{Camada:'Cenário Referencial de Inundação (previsto)',Versão:f.version,Nível:'N1',Classe:'C',
        'Área km²':fmt0(f.areaPrev),'Uso permitido':'Triagem e preparação — não autoriza projeto ou delimitação legal'},
      popupTemplate:popupFor('Cenário Referencial de Inundação')}));
    L['LY-OBS'].removeAll();
    f.obsRings.forEach(r=>L['LY-OBS'].add(new G({geometry:toPoly([r]),symbol:SYM.obs,
      attributes:{Camada:'FloodWatch NRT — observado (sintético)',Versão:f.version,Aquisição:f.acqId,
        'Latência min':f.latency,'Cobertura %':f.coverage,QA:f.qa,'Área km²':fmt0(f.areaObs),Aviso:WM},
      popupTemplate:popupFor('Observação de inundação — '+WM)})));
    L['LY-DIV'].removeAll();
    f.obsRings.forEach(r=>L['LY-DIV'].add(new G({geometry:toPoly([r]),symbol:SYM.div,
      attributes:{Camada:'Divergência previsto × observado',IoU:fmt(f.iou*100,1)+'%',
        'Área surpresa km²':fmt0(Math.max(0,f.areaObs-f.areaPrev)),Natureza:'Hipótese — exige investigação'},
      popupTemplate:popupFor('Divergência')})));
    L['LY-AOI'].removeAll();
    L['LY-AOI'].add(new G({geometry:toPoly([expandRing(PLANICIE,1.9,0.02,1)]),symbol:SYM.aoi,
      attributes:{AOI:'AOI-RS-GUAIBA-01',Prioridade:'Alta',SLA:'contratual — não firmado',Status:'monitoramento ativo'},
      popupTemplate:popupFor('AOI de aquisição SAR')}));
    if(L['LY-REDE'].graphics.length===0){
      ESTACOES.forEach(e=>{
        const c={online:[47,191,113],atrasada:[232,163,23],suspeita:[255,133,52],offline:[255,74,95]}[e.status]||[85,112,126];
        L['LY-REDE'].add(new G({geometry:{type:'point',longitude:e.lng,latitude:e.lat},
          symbol:pt(c.concat([.95]),e.bacia==='BAC-GUAIBA'?9:6.5),
          attributes:{Código:e.codigo,Estação:e.nome,Tipo:e.tipo,Operador:e.operador,Status:e.status,
            'Latência min':e.latencia,'Bateria %':e.bateria,Classe:e.cls,'Curva-chave':e.curva},
          popupTemplate:popupFor('{Estação}')}));
      });
    }
    if(L['LY-REC'].graphics.length===0){
      RECEPTORES.forEach(r=>{
        const rgb=[parseInt(r.cor.slice(1,3),16),parseInt(r.cor.slice(3,5),16),parseInt(r.cor.slice(5,7),16)];
        L['LY-REC'].add(new G({geometry:{type:'point',longitude:r.lng,latitude:r.lat},
          symbol:{type:'simple-marker',style:'square',color:rgb.concat([.9]),size:6,outline:{color:[6,13,19,.8],width:.8}},
          attributes:{Receptor:r.nome,Tipo:r.tipo,Município:r.municipio,Criticidade:r.criticidade,
            Classe:r.cls,'Cota limiar m':r.cota,Fonte:r.fonte},
          popupTemplate:popupFor('{Receptor}')}));
      });
    }
    if(L['LY-MUN'].graphics.length===0){
      MUNICIPIOS.forEach(m=>{
        const rr=0.055+Math.log10(m.pop)/95, ring=[];
        for(let i=0;i<12;i++){const a=i/12*Math.PI*2;ring.push([m.lng+Math.cos(a)*rr*1.2,m.lat+Math.sin(a)*rr])}
        L['LY-MUN'].add(new G({geometry:toPoly([ring]),
          symbol:{type:'simple-fill',color:sevRGBA(m.sev,.16),outline:{color:sevRGBA(m.sev,.9),width:1}},
          attributes:{Município:m.nome,UF:m.uf,'População':fmt0(m.pop),Severidade:m.sev},
          popupTemplate:popupFor('{Município}')}));
      });
    }
    if(L['LY-RSV'].graphics.length===0){
      RESERVATORIOS.forEach(r=>L['LY-RSV'].add(new G({geometry:{type:'point',longitude:r.lng,latitude:r.lat},
        symbol:{type:'simple-marker',style:'triangle',color:sevRGBA(r.sev,.95),size:12,outline:{color:[6,13,19,.9],width:1}},
        attributes:{Reservatório:r.nome,Rio:r.rio,UF:r.uf,'Volume útil %':r.volUtil,'Afluência m³/s':r.aflu,
          'Defluência m³/s':r.deflu,Regra:r.regra},
        popupTemplate:popupFor('{Reservatório}')})));
    }
  }

  /* ==========================================================================
     MOTOR RASTER — mapa deslizante próprio, sem dependências.
     Web Mercator · tiles por <img> (sem CORS, sem WebAssembly) · canvas 2D.
     ======================================================================== */
  const TS=256;
  const TILE_SRC=[
    {id:'carto',tpl:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',sub:['a','b','c'],
     attr:'© OpenStreetMap · © CARTO'},
    {id:'osm',tpl:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',sub:null,
     attr:'© OpenStreetMap contributors'}
  ];
  function projX(lng,z){return (lng+180)/360*TS*Math.pow(2,z)}
  function projY(lat,z){const s=Math.max(-0.9999,Math.min(0.9999,Math.sin(lat*Math.PI/180)));
    return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*TS*Math.pow(2,z)}
  function unprojLng(x,z){return x/(TS*Math.pow(2,z))*360-180}
  function unprojLat(y,z){const t=Math.PI-2*Math.PI*y/(TS*Math.pow(2,z));
    return 180/Math.PI*Math.atan(0.5*(Math.exp(t)-Math.exp(-t)))}
  function sevCss(s,a){
    const m={normal:'47,191,113',info:'53,184,240',atencao:'232,163,23',alerta:'255,133,52',critico:'255,74,95',modelado:'157,123,255'};
    return 'rgba('+(m[s]||'85,112,126')+','+a+')';
  }

  const tileCache=new Map(); let tileSrcIdx=0, tileFails=0, tilesLive=false;
  let rKey=null, rState=null, rRepaint=null, rOverride=null;

  function makeRaster(node,cfg){
    cfg=cfg||{};
    const key=JSON.stringify([cfg.center||null,cfg.zoom||null]);
    if(rOverride){rState={center:rOverride.center.slice(),zoom:rOverride.zoom};rKey=key;rOverride=null}
    else if(key!==rKey||!rState){rKey=key;rState={center:(cfg.center||[-51.24,-30.03]).slice(),zoom:cfg.zoom||9}}
    node.innerHTML='';
    const cv=el('canvas',{style:'position:absolute;inset:0;display:block;touch-action:none;cursor:'+(tool==='identify'?'crosshair':'grab')});
    node.appendChild(cv);
    const ctx=cv.getContext('2d');
    const hits=[];
    let W=0,H=0,dpr=1,raf=null;

    function schedule(){ if(raf)return; raf=requestAnimationFrame(()=>{raf=null;paint()}) }
    rRepaint=schedule;

    function resize(){
      const r=node.getBoundingClientRect();
      if(!r.width||!r.height)return false;
      dpr=Math.min(2,window.devicePixelRatio||1);
      W=r.width;H=r.height;
      cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
      cv.style.width=W+'px';cv.style.height=H+'px';
      return true;
    }
    function tileURL(z,x,y){
      const s=TILE_SRC[tileSrcIdx];
      return s.tpl.replace('{s}',s.sub?s.sub[(x+y)%s.sub.length]:'').replace('{z}',z).replace('{x}',x).replace('{y}',y);
    }
    function getTile(z,x,y){
      const k=tileSrcIdx+':'+z+'/'+x+'/'+y;
      let im=tileCache.get(k);
      if(im)return im;
      im=new Image();
      im.decoding='async';
      im.onload=()=>{tilesLive=true;schedule()};
      im.onerror=()=>{
        tileFails++;
        if(tileFails===14&&tileSrcIdx<TILE_SRC.length-1){
          tileSrcIdx++;tileFails=0;tileCache.clear();
          note('raster','fonte de tiles alternada para '+TILE_SRC[tileSrcIdx].id);
          schedule();
        }
      };
      im.src=tileURL(z,x,y);
      tileCache.set(k,im);
      if(tileCache.size>420){const it=tileCache.keys();for(let i=0;i<120;i++)tileCache.delete(it.next().value)}
      return im;
    }

    function paint(){
      if(!resize())return;
      const z=rState.zoom, n=Math.pow(2,z);
      const ox=projX(rState.center[0],z)-W/2, oy=projY(rState.center[1],z)-H/2;
      const S=(lng,lat)=>[projX(lng,z)-ox, projY(lat,z)-oy];
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#07121A';ctx.fillRect(0,0,W,H);

      const x0=Math.floor(ox/TS), x1=Math.floor((ox+W)/TS);
      const y0=Math.max(0,Math.floor(oy/TS)), y1=Math.min(n-1,Math.floor((oy+H)/TS));
      for(let tx=x0;tx<=x1;tx++)for(let ty=y0;ty<=y1;ty++){
        const wx=((tx%n)+n)%n;
        const im=getTile(z,wx,ty);
        const px=Math.round(tx*TS-ox), py=Math.round(ty*TS-oy);
        if(im.complete&&im.naturalWidth){try{ctx.drawImage(im,px,py,TS,TS)}catch(e){}}
        else{ctx.fillStyle='#0A1620';ctx.fillRect(px,py,TS,TS);
             ctx.strokeStyle='#101F2B';ctx.lineWidth=1;ctx.strokeRect(px+.5,py+.5,TS-1,TS-1)}
      }
      if(!tilesLive){
        ctx.strokeStyle='#12232F';ctx.lineWidth=1;
        for(let i=0;i<W;i+=48){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke()}
        for(let i=0;i<H;i+=48){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke()}
      }

      const vis=Array.from(effectiveVis(null));
      const f=frameNow();
      function ring(r,fill,stroke,w){
        ctx.beginPath();
        r.forEach((p,i)=>{const s=S(p[0],p[1]);i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1])});
        ctx.closePath();
        if(fill){ctx.fillStyle=fill;ctx.fill()}
        if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=w||1.5;ctx.stroke()}
      }
      if(vis.indexOf('LY-ENSO')>=0&&typeof ENSO_GRID!=='undefined'){
        const st=statsENSO();
        ENSO_GRID.forEach(c=>{
          const v=valorCelula(c,ENSOMAP.modo,st.sev,st.fat);
          const op=opacENSO(v,ENSOMAP.modo); if(op<=0)return;
          const a=S(c.x,c.y+c.p), b=S(c.x+c.p,c.y);
          if(b[0]<-20||a[0]>W+20||b[1]<-20||a[1]>H+20)return;
          const rgb=corENSO(v,ENSOMAP.modo);
          ctx.fillStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+op.toFixed(2)+')';
          ctx.fillRect(a[0],a[1],Math.max(1,b[0]-a[0]+0.6),Math.max(1,b[1]-a[1]+0.6));
        });
      }
      ctx.beginPath();
      CANAL_REF.forEach((p,i)=>{const s=S(p[0],p[1]);i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1])});
      ctx.strokeStyle='rgba(30,92,116,.85)';ctx.lineWidth=3;ctx.stroke();

      if(vis.indexOf('LY-MUN')>=0)MUNICIPIOS.forEach(m=>{
        const rr=0.055+Math.log10(m.pop)/95, rg=[];
        for(let i=0;i<14;i++){const a=i/14*Math.PI*2;rg.push([m.lng+Math.cos(a)*rr*1.2,m.lat+Math.sin(a)*rr])}
        ring(rg,sevCss(m.sev,.16),sevCss(m.sev,.85),1);
      });
      if(vis.indexOf('LY-AOI')>=0)ring(expandRing(PLANICIE,1.9,0.02,1),null,'rgba(25,211,232,.75)',1.4);
      if(vis.indexOf('LY-PREV')>=0)f.prevRings.forEach(r=>ring(r,'rgba(157,123,255,.30)','rgba(157,123,255,.95)',1.4));
      if(vis.indexOf('LY-OBS')>=0)f.obsRings.forEach(r=>ring(r,'rgba(53,184,240,.32)','rgba(25,211,232,1)',1.6));
      if(vis.indexOf('LY-DIV')>=0)f.obsRings.forEach(r=>ring(r,'rgba(255,74,95,.28)','rgba(255,74,95,.95)',1.4));

      hits.length=0;
      if(vis.indexOf('LY-REC')>=0)RECEPTORES.forEach(r=>{
        const s=S(r.lng,r.lat); if(s[0]<-10||s[0]>W+10||s[1]<-10||s[1]>H+10)return;
        ctx.fillStyle=r.cor;ctx.fillRect(s[0]-3,s[1]-3,6,6);
        ctx.strokeStyle='rgba(6,13,19,.8)';ctx.lineWidth=.8;ctx.strokeRect(s[0]-3,s[1]-3,6,6);
        hits.push({x:s[0],y:s[1],type:'receptor',data:r});
      });
      if(vis.indexOf('LY-RSV')>=0)RESERVATORIOS.forEach(r=>{
        const s=S(r.lng,r.lat); if(s[0]<-14||s[0]>W+14||s[1]<-14||s[1]>H+14)return;
        ctx.beginPath();ctx.moveTo(s[0],s[1]-7);ctx.lineTo(s[0]+7,s[1]+6);ctx.lineTo(s[0]-7,s[1]+6);ctx.closePath();
        ctx.fillStyle=sevCss(r.sev,.95);ctx.fill();
        ctx.strokeStyle='rgba(6,13,19,.9)';ctx.lineWidth=1;ctx.stroke();
        hits.push({x:s[0],y:s[1],type:'reservatorio',data:r});
      });
      if(vis.indexOf('LY-REDE')>=0)ESTACOES.forEach(e=>{
        const s=S(e.lng,e.lat); if(s[0]<-12||s[0]>W+12||s[1]<-12||s[1]>H+12)return;
        ctx.beginPath();ctx.arc(s[0],s[1],e.bacia==='BAC-GUAIBA'?5:3.6,0,6.2832);
        ctx.fillStyle={online:'#2FBF71',atrasada:'#E8A317',suspeita:'#FF8534',offline:'#FF4A5F'}[e.status]||'#55707F';
        ctx.fill();ctx.strokeStyle='rgba(6,13,19,.9)';ctx.lineWidth=1;ctx.stroke();
        hits.push({x:s[0],y:s[1],type:'estacao',data:e});
      });
      if(z>=9&&vis.indexOf('LY-MUN')>=0){
        ctx.font='10px "IBM Plex Sans", system-ui, sans-serif';
        MUNICIPIOS.forEach(m=>{const s=S(m.lng,m.lat);
          if(s[0]<0||s[0]>W||s[1]<0||s[1]>H)return;
          const tw=ctx.measureText(m.nome).width;
          ctx.fillStyle='rgba(6,13,19,.75)';ctx.fillRect(s[0]+7,s[1]-8,tw+6,13);
          ctx.fillStyle='#DCEAF3';ctx.fillText(m.nome,s[0]+10,s[1]+2)});
      }
      const at=TILE_SRC[tileSrcIdx].attr+'  ·  z'+z+'  ·  '+stamp(CLOCK.date());
      ctx.font='9px "IBM Plex Mono", monospace';
      const aw=ctx.measureText(at).width;
      ctx.fillStyle='rgba(6,13,19,.72)';ctx.fillRect(W-aw-12,H-16,aw+10,14);
      ctx.fillStyle='#8FA8B6';ctx.fillText(at,W-aw-7,H-6);
    }

    let dragging=false,moved=false,lx=0,ly=0;
    cv.addEventListener('pointerdown',ev=>{
      dragging=true;moved=false;lx=ev.clientX;ly=ev.clientY;
      cv.style.cursor='grabbing';
      try{cv.setPointerCapture&&cv.setPointerCapture(ev.pointerId)}catch(e){}
    });
    cv.addEventListener('pointermove',ev=>{
      if(!dragging)return;
      const dx=ev.clientX-lx, dy=ev.clientY-ly;
      if(Math.abs(dx)+Math.abs(dy)>3)moved=true;
      lx=ev.clientX;ly=ev.clientY;
      const z=rState.zoom;
      const nx=projX(rState.center[0],z)-dx, ny=projY(rState.center[1],z)-dy;
      rState.center=[unprojLng(nx,z),clamp(unprojLat(ny,z),-84,84)];
      schedule();
    });
    cv.addEventListener('pointerup',ev=>{
      if(!dragging)return; dragging=false; cv.style.cursor=tool==='identify'?'crosshair':'grab';
      if(moved)return;
      const r=cv.getBoundingClientRect();
      const px=ev.clientX-r.left, py=ev.clientY-r.top;
      if(tool!=='identify')return;
      let best=null,bd=1e9;
      hits.forEach(h=>{const d=(h.x-px)*(h.x-px)+(h.y-py)*(h.y-py);if(d<bd){bd=d;best=h}});
      if(best&&bd<170){APP.selected={type:best.type,data:best.data};APP.rightTab='detail';APP.rightOpen=true;APP.rerender();return}
      const z=rState.zoom, r2=cv.getBoundingClientRect();
      APP.selected={type:'coordenada',data:{
        Longitude:fmt(unprojLng(projX(rState.center[0],z)-r2.width/2+px,z),5),
        Latitude:fmt(unprojLat(projY(rState.center[1],z)-r2.height/2+py,z),5),
        Zoom:z,Instante:stamp(CLOCK.date()),Motor:'raster',
        'Sistema de referência':'EPSG:3857 · Web Mercator'}};
      APP.rightTab='detail';APP.rightOpen=true;APP.rerender();
    });
    cv.addEventListener('pointercancel',()=>{dragging=false;cv.style.cursor=tool==='identify'?'crosshair':'grab'});
    cv.addEventListener('wheel',ev=>{
      ev.preventDefault();
      const r=cv.getBoundingClientRect();
      const px=ev.clientX-r.left, py=ev.clientY-r.top;
      const z=rState.zoom, nz=clamp(z+(ev.deltaY<0?1:-1),3,17);
      if(nz===z)return;
      const lng=unprojLng(projX(rState.center[0],z)-r.width/2+px,z);
      const lat=unprojLat(projY(rState.center[1],z)-r.height/2+py,z);
      const nxc=projX(lng,nz)+(r.width/2-px), nyc=projY(lat,nz)+(r.height/2-py);
      rState.zoom=nz;
      rState.center=[unprojLng(nxc,nz),clamp(unprojLat(nyc,nz),-84,84)];
      schedule();
    },{passive:false});
    cv.addEventListener('dblclick',()=>{rState.zoom=clamp(rState.zoom+1,3,17);schedule()});

    const ctr=el('div',{class:'map-ov',style:'right:9px;bottom:52px;display:flex;flex-direction:column;gap:4px'});
    [['+',1],['−',-1]].forEach(b=>{
      const btn=el('button',{class:'btn',style:'width:28px;height:28px;justify-content:center;padding:0;font-size:15px'},b[0]);
      btn.onclick=()=>{rState.zoom=clamp(rState.zoom+b[1],3,17);schedule()};
      ctr.appendChild(btn);
    });
    node.appendChild(ctr);

    if(typeof ResizeObserver!=='undefined'){try{new ResizeObserver(()=>schedule()).observe(node)}catch(e){}}
    schedule(); setTimeout(schedule,120); setTimeout(schedule,600);
  }

  /* ---------- montagem ---------- */
  function mount(node,cfg){
    cfg=cfg||{}; cfgAtual=cfg; host=node;
    if(engine==='raster'){makeRaster(node,cfg);return}
    if(!viewHost){                       // módulos do SDK ainda não resolveram
      waiters.push(()=>{if(host===node)mount(node,cfg)});
      node.innerHTML='<div class="maploading">Carregando ArcGIS Maps SDK…</div>';
      return;
    }
    node.innerHTML='';
    try{ node.appendChild(viewHost); }catch(e){ degrade('não foi possível anexar o contêiner do mapa'); return; }
    armarWatchdog();
    if(!ready){                          // contêiner já na página: o view termina de inicializar
      node.appendChild(el('div',{class:'maploading'},'Inicializando mapa…'));
      waiters.push(()=>{if(host===node)mount(node,cfg)});
      return;
    }
    applyVis(cfg.layers);
    try{ viewHost.style.cursor = tool==='identify'?'crosshair':'grab'; }catch(e){}
    if(cfg.center){try{view.goTo({center:cfg.center,zoom:cfg.zoom||9},{duration:600}).catch(()=>{})}catch(e){}}
    if(swipeW){try{swipeW.destroy()}catch(e){};swipeW=null}
    if(cfg.swipe&&sdk.Swipe){
      try{swipeW=new sdk.Swipe({view,leadingLayers:[L['LY-PREV']],trailingLayers:[L['LY-OBS']],position:50,direction:'horizontal'});
        view.ui.add(swipeW)}catch(e){}
    }
    drawLocal(true);
  }
  function applyVis(ids){
    const set=effectiveVis(ids);
    if(engine==='raster'){if(rRepaint)rRepaint();return set}
    if(!ready)return set;
    LAYERS.forEach(l=>{const ly=map.findLayerById(l.id);if(ly)ly.visible=set.has(l.id)});
    return set;
  }
  function toggle(id){
    const cfg=LAYERS.find(l=>l.id===id); if(!cfg)return;
    const set=effectiveVis(null);
    visUser[id]=!set.has(id);              // a escolha do operador persiste entre re-renderizações
    applyVis(null);
    const on=visUser[id];
    if(on&&cfg.url){
      const h=LAYER_HEALTH[id]||{};
      if(h.status==='offline')UI.toast('Camada indisponível',cfg.nome+' — '+(h.msg||'serviço não respondeu'),'warn');
    }
    if(engine==='raster'&&rRepaint)rRepaint();
    APP.rerender();
  }
  function setTool(t){tool=t;
    if(ready&&view&&view.container)view.container.style.cursor=t==='identify'?'crosshair':'grab';
    APP.rerender()}

  function goTo(center,zoom){
    if(engine==='raster'){
      rState={center:center.slice(),zoom:zoom||10};
      rOverride={center:center.slice(),zoom:zoom||10};
      if(rRepaint)rRepaint();
      return;
    }
    if(ready){try{view.goTo({center,zoom:zoom||10},{duration:700}).catch(()=>{})}catch(e){}}
  }
  function retry(){
    if(engine==='arcgis')return;
    engine='loading';ready=false;sdk=null;view=null;map=null;L={};lastFrame=-1;viewHost=null;wdArmado=false;
    note('sdk','recarregamento solicitado pelo operador');
    if(host)host.innerHTML='<div class="maploading">Recarregando ArcGIS Maps SDK…</div>';
    APP.rerender();
    boot();
  }
  /* Sonda direta dos endpoints: distingue "serviço fora do ar" de "SDK não
     conseguiu construir a camada", que a mensagem do SDK costuma confundir. */
  function probeServices(){
    const alvos=LAYERS.filter(l=>l.url);
    UI.toast('Testando serviços',alvos.length+' endpoints em verificação…','ai');
    return Promise.all(alvos.map(cfg=>{
      const t0=performance.now();
      return fetch(cfg.url+'?f=json',{method:'GET',mode:'cors'})
        .then(r=>r.ok?r.json().then(j=>({cfg,ms:Math.round(performance.now()-t0),
              ok:!j.error,msg:j.error?('erro do serviço: '+(j.error.message||j.error.code)):
                ((j.mapName||j.name||j.serviceDescription||'serviço respondeu')+
                 (j.layers?' · '+j.layers.length+' camadas':''))}))
            :({cfg,ms:Math.round(performance.now()-t0),ok:false,msg:'HTTP '+r.status}))
        .catch(e=>({cfg,ms:Math.round(performance.now()-t0),ok:false,
              msg:'inacessível pelo navegador (CORS, rede ou endpoint inexistente)'}));
    })).then(res=>{
      res.forEach(r=>{LAYER_HEALTH[r.cfg.id]={status:r.ok?'ok':'offline',ms:r.ms,msg:r.msg}});
      const ok=res.filter(r=>r.ok).length;
      UI.toast('Teste concluído',ok+' de '+res.length+' serviços responderam. Detalhes no diagnóstico.',ok===res.length?'ok':'warn');
      APP.rerender(); return res;
    });
  }
  function refreshENSO(){
    if(engine==='arcgis')drawENSO(true);
    else if(engine==='raster'&&rRepaint)rRepaint();
    APP.rerender();
  }
  function engineLabel(){
    if(engine==='arcgis')return 'ArcGIS SDK 4.30';
    if(engine==='raster')return 'motor raster';
    return 'carregando…';
  }

  if(typeof window!=='undefined'&&window.addEventListener){
    let larguraAnterior=window.innerWidth;
    window.addEventListener('resize',debounce(()=>{
      const antes=larguraAnterior<1180, agora=window.innerWidth<1180;
      larguraAnterior=window.innerWidth;
      if(painelPref==null&&antes!==agora)APP.rerender();
    },220));
  }

  CLOCK.onTick(()=>{
    if(engine==='arcgis'&&ready)drawLocal(false);
    else if(engine==='raster'&&rRepaint&&frameNow().i!==lastFrame){lastFrame=frameNow().i;rRepaint()}
  });

  boot();
  return {mount,toggle,goTo,applyVis,retry,engineLabel,setBasemap,setTool,probeServices,panelsOpen,togglePanels,refreshENSO,tool:()=>tool,visible:()=>effectiveVis(null),basemaps:()=>BASEMAPS,basemapId:()=>basemapId,
    isReady:()=>ready, isFailed:()=>engine==='raster', engine:()=>engine,
    diag:()=>diag, view:()=>view};
})();

/* ---------- Bloco de mapa reutilizável nas telas ---------- */
function mapBlock(o){
  o=o||{};
  const id='mapholder';
  setTimeout(()=>{
    const n=document.getElementById(id); if(!n)return;
    MAPS.mount(n,{center:o.center,zoom:o.zoom,layers:o.layers,swipe:o.swipe});
    $$('.lyr[data-ly]').forEach(b=>b.onclick=()=>MAPS.toggle(b.dataset.ly));
    $$('.lyr[data-bm]').forEach(b=>b.onclick=()=>MAPS.setBasemap(b.dataset.bm));
    const rb=$('#retrySdk'); if(rb)rb.onclick=()=>MAPS.retry();
    $$('#mapTool button[data-tool]').forEach(b=>b.onclick=()=>MAPS.setTool(b.dataset.tool));
    const tp=$('#togglePanels'); if(tp)tp.onclick=()=>MAPS.togglePanels();
    const av=$('#allVis'); if(av)av.onclick=()=>{
      LAYERS.filter(l=>l.grupo!=='Contexto').forEach(l=>{if(!MAPS.visible().has(l.id))MAPS.toggle(l.id)})};
    const db=$('#diagBtn'); if(db)db.onclick=()=>UI.modal('Diagnóstico do motor geoespacial',
      `<div class="doc" style="font-size:11.5px">
        <p>Motor ativo: <b>${esc(MAPS.engineLabel())}</b>.</p>
        <h4>Registro de inicialização</h4>
        <div class="tool">${MAPS.diag().map(d=>
          `<span class="to"><span style="color:var(--faint)">${hhmm(d.t)}</span> <span class="tn">${esc(d.kind)}</span> ${esc(d.msg)}</span>`).join('')||'<span class="to">sem registros</span>'}</div>
        <h4>Serviços externos</h4>
        <table class="tbl"><tbody>${LAYERS.filter(l=>l.url).map(l=>{const h=LAYER_HEALTH[l.id]||{};
          return `<tr style="cursor:default"><td style="width:34%">${esc(l.nome)}</td>
            <td><span class="mono tiny faint">${esc(l.url.replace('https://',''))}</span></td>
            <td style="white-space:nowrap">${UI.statusDot(h.status)} <span class="tiny">${esc(h.msg||h.status||'—')}</span></td></tr>`}).join('')}
        </tbody></table>
        <h4>Por que o SDK pode não iniciar em uma página publicada</h4>
        <ul>
          <li><b>CSP sem <code>wasm-unsafe-eval</code></b> em <code>script-src</code> — o SDK usa WebAssembly e o MapView não inicializa.</li>
          <li><b>CSP sem <code>worker-src blob:</code></b> — o SDK cai para a thread principal e pode não concluir.</li>
          <li><b>iframe de origem opaca</b>, sem <code>allow-same-origin</code> — acesso a storage lança <code>SecurityError</code>.</li>
          <li><b><code>script-src</code> sem <code>js.arcgis.com</code></b> — o script sequer chega a carregar.</li>
          <li><b>WebGL indisponível</b> no dispositivo ou no contexto de renderização.</li>
        </ul>
        <h4>O que a aplicação faz nesse caso</h4>
        <p>Assume o motor raster próprio: mapa deslizante em projeção Web Mercator, tiles servidos por
        <code>&lt;img&gt;</code> — que não dependem de CORS nem de WebAssembly — e todas as camadas operacionais
        desenhadas em canvas 2D. Arraste para deslocar, use a roda para o zoom e clique em um ponto para inspecioná-lo

  function timelineSVG(){
    const W=1000,H=74;
    const xs=h=>28+(h/72)*(W-40);
    let s=`<svg id="timelineSvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
    // hidrograma de fundo
    const pts=[];for(let h=0;h<=72;h+=.5)pts.push([h,stageAt(h)]);
    const ymax=PEAK_STAGE*1.2, ys=v=>H-14-(v/ymax)*(H-26);
    s+=`<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#19D3E8" stop-opacity=".32"/><stop offset="100%" stop-color="#19D3E8" stop-opacity="0"/></linearGradient></defs>`;
    s+=`<path d="${pts.map((p,i)=>(i?'L':'M')+xs(p[0]).toFixed(1)+' '+ys(p[1]).toFixed(1)).join(' ')} L${xs(72)} ${H-14} L${xs(0)} ${H-14} Z" fill="url(#tg)"/>`;
    s+=`<path d="${pts.map((p,i)=>(i?'L':'M')+xs(p[0]).toFixed(1)+' '+ys(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="#19D3E8" stroke-width="1.5"/>`;
    // chuva
    for(let h=0;h<=72;h+=1){const v=rainAt(h);const hh=v/48*26;
      s+=`<rect x="${xs(h)-1.6}" y="${8}" width="3.2" height="${Math.max(0,hh).toFixed(1)}" fill="#35B8F0" opacity=".45"/>`}
    // limiares
    [['inundação',NIVEIS.inundacao,'#FF4A5F'],['alerta',NIVEIS.alerta,'#FF8534'],['atenção',NIVEIS.atencao,'#E8A317']].forEach(t=>{
      s+=`<line x1="28" x2="${W-12}" y1="${ys(t[1])}" y2="${ys(t[1])}" stroke="${t[2]}" stroke-width=".8" stroke-dasharray="3 3" opacity=".7"/>`;
      s+=`<text x="30" y="${ys(t[1])-2}" font-size="7.5" fill="${t[2]}" font-family="Barlow Condensed" letter-spacing=".8">${t[0].toUpperCase()}</text>`});
    // marcos
    SIM.marcos.forEach(m=>{const x=xs(m[0]);
      s+=`<line x1="${x}" x2="${x}" y1="${H-20}" y2="${H-8}" stroke="${sevColor(m[1])}" stroke-width="1.5"/>`});
    // aquisições SAR
    FRAMES.forEach(f=>{const x=xs(f.h);
      s+=`<circle cx="${x}" cy="${H-4}" r="${f.h<=CLOCK.hour()?2.6:1.6}" fill="${f.h<=CLOCK.hour()?'#9D7BFF':'#2A4256'}"/>`});
    // eixo de horas
    for(let h=0;h<=72;h+=6){const x=xs(h);
      s+=`<line x1="${x}" x2="${x}" y1="${H-14}" y2="${H-10}" stroke="#2A4256"/>`;
      s+=`<text x="${x}" y="${H-16}" text-anchor="middle" font-size="7.5" fill="#4E6673" font-family="IBM Plex Mono">${h}h</text>`}
    // cursor
    const cx=xs(CLOCK.hour());
    s+=`<rect x="28" y="0" width="${cx-28}" height="${H}" fill="#19D3E8" opacity=".05"/>`;
    s+=`<line x1="${cx}" x2="${cx}" y1="0" y2="${H}" stroke="#fff" stroke-width="1.4"/>`;
    s+=`<circle cx="${cx}" cy="6" r="3.4" fill="#fff"/>`;
    s+=`<text x="8" y="12" font-size="7.5" fill="#35B8F0" font-family="Barlow Condensed" letter-spacing=".8">CHUVA</text>`;
    s+=`<text x="8" y="${H-30}" font-size="7.5" fill="#19D3E8" font-family="Barlow Condensed" letter-spacing=".8">NÍVEL</text>`;
    s+=`<text x="8" y="${H-2}" font-size="7.5" fill="#9D7BFF" font-family="Barlow Condensed" letter-spacing=".8">SAR</text>`;
    return s+'</svg>';
  }

        <div class="sticky-note" style="margin-top:14px">
          Cenário ativo <b class="mono">${esc(SCEN.scenarioId)}</b> · seed <b class="mono">${SCEN.seed}</b> ·
          janela de 72 h com snapshots a cada 3 h · ${esc(SCEN.rotulo)}
        </div></div>`;
      o.classList.add('on');
      $('#lclose').onclick=()=>toggleLauncher(false);
      $$('#launcher .lcard').forEach(b=>b.onclick=()=>{toggleLauncher(false);APP.goModule(b.dataset.m)});
      o.onclick=e=>{if(e.target===o)toggleLauncher(false)};
    }else o.classList.remove('on');
  }

  /* ---------------- command palette ---------------- */
  let palIdx=0, palItems=[];
  function togglePalette(on){
    const p=$('#palette');
    if(!on){p.classList.remove('on');return}
    palItems=[];
    MODULOS.forEach(m=>(SCREENS[m.id]||[]).forEach(s=>palItems.push({id:s.id,t:s.nome,d:m.curto,go:()=>APP.go(s.id)})));
    AGENTES.forEach(a=>palItems.push({id:a.id,t:a.nome,d:'agente · '+a.mod,go:()=>{APP.selected={type:'agent',data:a};APP.rightTab='agent';APP.rightOpen=true;APP.go('M18-04')}}));
    INCIDENTES.forEach(i=>palItems.push({id:i.id,t:i.nome,d:'evento · nível '+i.nivel,go:()=>{CTX.incidentId=i.id;CTX.basinIds=[i.bacia];APP.go('M9-03')}}));
    BACIAS.forEach(b=>palItems.push({id:b.id,t:b.nome,d:'bacia · '+b.fid,go:()=>{CTX.basinIds=[b.id];MAPS.goTo([b.lng,b.lat],8);APP.go('M0-02')}}));
    EST_RS.forEach(e=>palItems.push({id:e.codigo,t:e.nome,d:'estação · '+e.tipo,go:()=>{APP.selected={type:'est',data:e};MAPS.goTo([e.lng,e.lat],11);APP.go('M2-02')}}));
    STORE.cases.forEach(c=>palItems.push({id:c.id,t:c.titulo,d:'caso regulatório',go:()=>APP.go('M13-02')}));
    p.innerHTML=`<div class="pal"><input id="palInput" placeholder="Ir para tela, evento, bacia, estação, agente ou caso…" autocomplete="off"><div class="res" id="palRes"></div></div>`;
    p.classList.add('on');
    const inp=$('#palInput'); inp.focus(); palIdx=0;
    const draw=()=>{
      const q=inp.value.toLowerCase();
      const r=palItems.filter(i=>!q||(i.id+' '+i.t+' '+i.d).toLowerCase().includes(q)).slice(0,40);
      $('#palRes').innerHTML=r.length?r.map((i,k)=>`<button class="ri ${k===palIdx?'cur':''}" data-k="${k}">
        <span class="rid">${esc(i.id)}</span><span>${esc(i.t)}</span><span class="rd">${esc(i.d)}</span></button>`).join('')
        :UI.state('Nada encontrado','Tente o identificador da tela (M7-03), o nome de uma bacia ou o código de uma estação.','⌕');
      $$('#palRes .ri').forEach(b=>b.onclick=()=>{togglePalette(false);r[Number(b.dataset.k)].go()});
      window.__palR=r;
    };
    draw(); inp.oninput=()=>{palIdx=0;draw()};
    inp.onkeydown=e=>{
      const r=window.__palR||[];
      if(e.key==='ArrowDown'){palIdx=Math.min(r.length-1,palIdx+1);draw();e.preventDefault()}
      else if(e.key==='ArrowUp'){palIdx=Math.max(0,palIdx-1);draw();e.preventDefault()}
      else if(e.key==='Enter'&&r[palIdx]){togglePalette(false);r[palIdx].go()}
      else if(e.key==='Escape')togglePalette(false);
    };
    p.onclick=e=>{if(e.target===p)togglePalette(false)};
  }

  function renderAll(){topbar();ctxbar();sidebar();canvas();rightpanel();eventrail()}
  return {renderAll,toggleLauncher,togglePalette,timelineSVG,FIDELIDADE};
})();
</script>
