<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HidroClima Brasil — Radar das Águas | Plataforma Nacional de Inteligência Hidrometeorológica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/dark/main.css">
<script src="https://js.arcgis.com/4.30/"></script>
<style>
/* ============================================================
   HIDROCLIMA BRASIL — design tokens
   Vernáculo visual: batimetria, régua limnimétrica, hidrograma.
   Paleta semântica obrigatória (PRD §12.1) + cyan hidro operacional.
   ============================================================ */
:root{
  --abyss:#060D13; --panel:#0A151E; --surface:#0F1F2B; --raised:#142936; --raised2:#1A3446;
  --line:#1C3243; --line2:#26445A; --ink:#DCEAF3; --ink2:#AEC6D6; --muted:#75919F; --faint:#4E6673;

  --normal:#2FBF71; --info:#35B8F0; --atencao:#E8A317; --alerta:#FF8534; --critico:#FF4A5F;
  --modelado:#9D7BFF; --semdados:#55707F; --hidro:#19D3E8; --obs:#35B8F0;

  --n-bg:rgba(47,191,113,.13); --i-bg:rgba(53,184,240,.13); --a-bg:rgba(232,163,23,.14);
  --l-bg:rgba(255,133,52,.14); --c-bg:rgba(255,74,95,.14); --m-bg:rgba(157,123,255,.14);
  --s-bg:rgba(85,112,126,.14);

  --disp:'Barlow Condensed',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;

  --topbar-h:52px; --ctx-h:38px; --rail-h:104px; --side-w:236px; --right-w:352px;
  --r:3px; --r2:6px;
  --shadow:0 18px 46px -20px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--abyss); color:var(--ink);
  font-family:var(--body); font-size:13px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
/* Malha batimétrica sutil no fundo — assinatura do domínio */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background:
    radial-gradient(1200px 700px at 78% -10%, rgba(25,211,232,.06), transparent 62%),
    radial-gradient(900px 600px at 8% 108%, rgba(157,123,255,.05), transparent 60%);
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--panel)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:#31556F}
:focus-visible{outline:2px solid var(--hidro); outline-offset:1px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--hidro);text-decoration:none}

/* ---------- tipografia utilitária ---------- */
.disp{font-family:var(--disp);font-weight:600;letter-spacing:.02em;line-height:1.05}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--disp);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dim{color:var(--muted)} .faint{color:var(--faint)}
.tiny{font-size:10.5px} .sm{font-size:11.5px}

/* ---------- layout shell ---------- */
#app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column}
#topbar{
  height:var(--topbar-h);flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:0 12px;background:linear-gradient(180deg,#0B1922,#081218);
  border-bottom:1px solid var(--line);
}
#ctxbar{
  height:var(--ctx-h);flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 12px;
  background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;
}
#mid{flex:1 1 auto;display:flex;min-height:0}
#sidebar{
  width:var(--side-w);flex:0 0 var(--side-w);background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
#canvas{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--abyss);overflow:hidden}
#rightpanel{
  width:var(--right-w);flex:0 0 var(--right-w);background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;transition:margin-right .18s ease;
}
#rightpanel.collapsed{margin-right:calc(-1 * var(--right-w))}
#eventrail{
  height:var(--rail-h);flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);
  display:flex;min-height:0;transition:height .18s ease;
}
#eventrail.collapsed{height:30px}

/* ---------- topbar ---------- */
.brand{display:flex;align-items:center;gap:9px;padding-right:12px;border-right:1px solid var(--line);height:100%}
.brand-mark{width:26px;height:26px;flex:0 0 26px}
.brand-txt .t1{font-family:var(--disp);font-size:16px;font-weight:700;letter-spacing:.04em;line-height:1}
.brand-txt .t2{font-size:9.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;font-family:var(--disp);font-weight:500}
.tb-btn{
  display:flex;align-items:center;gap:6px;height:30px;padding:0 9px;border:1px solid var(--line2);
  border-radius:var(--r);background:var(--surface);font-size:11.5px;color:var(--ink2);white-space:nowrap;
}
.tb-btn:hover{background:var(--raised);color:var(--ink);border-color:#31556F}
.tb-btn.on{border-color:var(--hidro);color:var(--hidro);background:rgba(25,211,232,.1)}
.spacer{flex:1 1 auto}
#globalsearch{
  height:30px;width:250px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);
  padding:0 9px;color:var(--ink);font-size:11.5px;
}
#globalsearch::placeholder{color:var(--faint)}
.clock{font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:var(--ink)}
.clock .d{color:var(--muted);font-size:10.5px}
.simbadge{
  display:flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:var(--r);
  background:var(--m-bg);border:1px solid rgba(157,123,255,.45);color:#C6B2FF;
  font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
}
.pulse{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}*{transition:none!important}}

.avatar{width:27px;height:27px;border-radius:50%;background:var(--raised2);border:1px solid var(--line2);
  display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:11.5px;color:var(--hidro)}

/* ---------- context bar ---------- */
.ctx-chip{
  display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--line);font-size:11px;white-space:nowrap;flex:0 0 auto;
}
.ctx-chip .k{color:var(--faint);font-family:var(--disp);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.ctx-chip .v{color:var(--ink);font-weight:500}
.ctx-chip.act{border-color:var(--hidro);background:rgba(25,211,232,.09)}
.ctx-chip button{color:var(--muted);font-size:12px;line-height:1}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;flex:0 0 auto}
.seg button{padding:0 9px;height:24px;font-size:11px;color:var(--muted);border-right:1px solid var(--line2);background:var(--surface)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--raised2);color:var(--ink)}
.seg button.on[data-v="observed"]{color:var(--obs);box-shadow:inset 0 -2px 0 var(--obs)}
.seg button.on[data-v="predicted"]{color:var(--modelado);box-shadow:inset 0 -2px 0 var(--modelado)}
.seg button.on[data-v="convergence"]{color:var(--hidro);box-shadow:inset 0 -2px 0 var(--hidro)}

/* ---------- sidebar ---------- */
.side-head{padding:11px 12px 9px;border-bottom:1px solid var(--line)}
.side-head .mid{font-family:var(--mono);font-size:10px;color:var(--hidro);letter-spacing:.1em}
.side-head .mname{font-family:var(--disp);font-size:16.5px;font-weight:600;line-height:1.12;margin-top:2px}
.side-head .mmis{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.35}
.side-nav{flex:1 1 auto;overflow-y:auto;padding:6px 0}
.side-sec{padding:9px 12px 4px;font-family:var(--disp);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.side-item{
  display:flex;align-items:center;gap:8px;width:100%;padding:6px 12px;font-size:12.2px;color:var(--ink2);
  border-left:2px solid transparent;text-align:left;
}
.side-item:hover{background:var(--surface);color:var(--ink)}
.side-item.on{background:linear-gradient(90deg,rgba(25,211,232,.14),transparent);border-left-color:var(--hidro);color:#fff}
.side-item .sid{font-family:var(--mono);font-size:9.5px;color:var(--faint);flex:0 0 auto;width:46px}
.side-item.on .sid{color:var(--hidro)}
.side-item .badge{margin-left:auto}
.side-foot{border-top:1px solid var(--line);padding:9px 12px;display:grid;gap:6px}
.hstat{display:flex;align-items:center;justify-content:space-between;font-size:10.5px}
.hstat .lab{color:var(--muted)}

/* ---------- badges & pills ---------- */
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:2px;
  font-family:var(--disp);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid transparent;white-space:nowrap;
}
.b-normal{background:var(--n-bg);color:var(--normal);border-color:rgba(47,191,113,.4)}
.b-info{background:var(--i-bg);color:var(--info);border-color:rgba(53,184,240,.4)}
.b-atencao{background:var(--a-bg);color:var(--atencao);border-color:rgba(232,163,23,.42)}
.b-alerta{background:var(--l-bg);color:var(--alerta);border-color:rgba(255,133,52,.42)}
.b-critico{background:var(--c-bg);color:var(--critico);border-color:rgba(255,74,95,.45)}
.b-modelado{background:var(--m-bg);color:var(--modelado);border-color:rgba(157,123,255,.42)}
.b-semdados{background:var(--s-bg);color:var(--semdados);border-color:rgba(85,112,126,.42)}
.b-hidro{background:rgba(25,211,232,.12);color:var(--hidro);border-color:rgba(25,211,232,.4)}
.cls{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:2px;font-family:var(--disp);
  font-weight:700;font-size:11px;border:1px solid}
.cls-A{background:var(--n-bg);color:var(--normal);border-color:rgba(47,191,113,.5)}
.cls-B{background:var(--i-bg);color:var(--info);border-color:rgba(53,184,240,.5)}
.cls-C{background:var(--a-bg);color:var(--atencao);border-color:rgba(232,163,23,.5)}
.cls-D{background:var(--l-bg);color:var(--alerta);border-color:rgba(255,133,52,.5)}
.cls-E{background:var(--c-bg);color:var(--critico);border-color:rgba(255,74,95,.5)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 7px}

/* ---------- canvas / screens ---------- */
.scr-head{
  flex:0 0 auto;display:flex;align-items:flex-start;gap:12px;padding:11px 14px 9px;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panel),rgba(10,21,30,.5));
}
.scr-head .h-id{font-family:var(--mono);font-size:10px;color:var(--hidro);letter-spacing:.08em}
.scr-head h1{font-family:var(--disp);font-size:20px;font-weight:600;margin:1px 0 0;letter-spacing:.01em;line-height:1.1}
.scr-head .h-obj{font-size:11.5px;color:var(--muted);margin-top:3px;max-width:820px}
.scr-actions{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:var(--r);
  border:1px solid var(--line2);background:var(--surface);color:var(--ink2);font-size:11.5px;font-weight:500;white-space:nowrap;
}
.btn:hover{background:var(--raised);color:var(--ink);border-color:#31556F}
.btn-p{background:linear-gradient(180deg,#0E7C8C,#0A5F6D);border-color:#12A0B4;color:#EAFDFF}
.btn-p:hover{background:linear-gradient(180deg,#12A0B4,#0E7C8C);border-color:var(--hidro);color:#fff}
.btn-d{border-color:rgba(255,74,95,.5);color:#FF8C99;background:var(--c-bg)}
.btn-d:hover{background:rgba(255,74,95,.22);color:#fff}
.btn-g{border-color:rgba(47,191,113,.5);color:#6FE0A2;background:var(--n-bg)}
.btn-g:hover{background:rgba(47,191,113,.24);color:#fff}
.btn-sm{height:23px;padding:0 8px;font-size:10.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:0;flex:0 0 auto;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
.tab{padding:7px 13px;font-size:11.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink2);background:var(--surface)}
.tab.on{color:var(--ink);border-bottom-color:var(--hidro);background:var(--surface)}
.tab .tid{font-family:var(--mono);font-size:9px;color:var(--faint);margin-right:5px}
.tab.on .tid{color:var(--hidro)}
.scr-body{flex:1 1 auto;overflow:auto;padding:12px 14px 20px;min-height:0}
.scr-body.nopad{padding:0}

/* ---------- grids & cards ---------- */
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.gA{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.gB{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.gC{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
@media(max-width:1500px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1250px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.gA,.gB,.gC{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card-h{display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid var(--line);background:rgba(20,41,54,.4);flex:0 0 auto}
.card-h h3{font-family:var(--disp);font-size:13.5px;font-weight:600;margin:0;letter-spacing:.03em;text-transform:uppercase;color:var(--ink)}
.card-h .sub{font-size:10.5px;color:var(--muted)}
.card-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:11px;flex:1 1 auto;min-height:0;overflow:auto}
.card-b.tight{padding:0}
.card-f{padding:6px 11px;border-top:1px solid var(--line);font-size:10px;color:var(--faint);display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex:0 0 auto}
.card-f .src{font-family:var(--mono);font-size:9.5px}

/* KPI + régua limnimétrica (elemento-assinatura) */
.kpi{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:9px 11px 9px 26px;overflow:hidden}
.kpi .rule{position:absolute;left:0;top:0;bottom:0;width:16px;background:linear-gradient(180deg,rgba(25,211,232,.06),transparent);border-right:1px solid var(--line)}
.kpi .rule i{position:absolute;left:4px;right:2px;height:1px;background:var(--line2)}
.kpi .rule b{position:absolute;left:0;right:0;height:2px;background:currentColor;box-shadow:0 0 8px currentColor}
.kpi .kl{font-family:var(--disp);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.kpi .kv{font-family:var(--disp);font-weight:700;font-size:27px;line-height:1.05;letter-spacing:-.01em;margin-top:1px}
.kpi .ku{font-size:11px;color:var(--muted);font-family:var(--body);font-weight:400;margin-left:3px}
.kpi .kd{font-size:10.5px;color:var(--muted);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi .trend{font-family:var(--mono);font-size:10px}
.up{color:var(--critico)} .down{color:var(--normal)} .flat{color:var(--muted)}

/* ---------- tabelas ---------- */
.tbl-wrap{overflow:auto;min-height:0}
table.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
table.tbl th{
  position:sticky;top:0;z-index:2;background:#0D1D28;text-align:left;padding:6px 9px;
  font-family:var(--disp);font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none;
}
table.tbl th:hover{color:var(--ink)}
table.tbl th .ar{color:var(--hidro);font-size:9px}
table.tbl td{padding:5px 9px;border-bottom:1px solid rgba(28,50,67,.6);vertical-align:middle;white-space:nowrap}
table.tbl tbody tr{cursor:pointer}
table.tbl tbody tr:hover{background:var(--raised)}
table.tbl tbody tr.sel{background:rgba(25,211,232,.11);box-shadow:inset 2px 0 0 var(--hidro)}
table.tbl td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
table.tbl td.wrap{white-space:normal;min-width:200px}
.tbl-tools{display:flex;gap:6px;align-items:center;padding:6px 9px;border-bottom:1px solid var(--line);background:rgba(13,29,40,.6);flex-wrap:wrap}
.inp{height:25px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:0 8px;color:var(--ink);font-size:11.5px}
.inp::placeholder{color:var(--faint)}
select.inp{padding-right:4px}
textarea.inp{height:auto;padding:6px 8px;resize:vertical;line-height:1.45;width:100%}

/* ---------- formulários ---------- */
.form{display:grid;gap:11px}
.fset{border:1px solid var(--line);border-radius:var(--r2);padding:0;overflow:hidden}
.fset > legend{display:none}
.fset-h{padding:6px 11px;background:rgba(20,41,54,.5);border-bottom:1px solid var(--line);
  font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.fset-b{padding:11px;display:grid;gap:10px}
.frow{display:grid;gap:10px}
.frow.c2{grid-template-columns:1fr 1fr}.frow.c3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:900px){.frow.c2,.frow.c3{grid-template-columns:1fr}}
.fld label{display:block;font-family:var(--disp);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.fld label .req{color:var(--critico)}
.fld .inp,.fld select,.fld textarea{width:100%}
.fld .hint{font-size:10px;color:var(--faint);margin-top:3px}
.fld.err .inp{border-color:var(--critico)}
.fld .emsg{font-size:10px;color:var(--critico);margin-top:3px;display:none}
.fld.err .emsg{display:block}
.chks{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid var(--line2);border-radius:var(--r);
  background:var(--panel);font-size:11px;cursor:pointer}
.chk.on{border-color:var(--hidro);background:rgba(25,211,232,.1);color:var(--hidro)}

/* ---------- painel direito ---------- */
.rp-tabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto;background:var(--panel)}
.rp-tabs button{flex:1;padding:7px 4px;font-size:10.5px;color:var(--muted);border-bottom:2px solid transparent;
  font-family:var(--disp);letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.rp-tabs button.on{color:var(--ink);border-bottom-color:var(--hidro);background:var(--surface)}
.rp-body{flex:1 1 auto;overflow:auto;padding:11px;min-height:0}
.rp-sec{margin-bottom:14px}
.rp-sec > .t{font-family:var(--disp);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);
  margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:104px 1fr;gap:3px 9px;font-size:11.5px}

  const rise = 4.90/(1+Math.exp(-(h-30)/5.6));             // subida logística
  const rec  = -3.95/(1+Math.exp(-(h-57)/5.0));            // recessão
  const wob  = Math.sin(h/4.1)*0.055 + Math.sin(h/1.7)*0.022;
  return Math.max(0.9, base+rise+rec+wob);
}
function rainAt(h){                           // mm/h areal na bacia
  const b1=26*Math.exp(-Math.pow((h-19)/6.2,2));
  const b2=41*Math.exp(-Math.pow((h-30)/4.4,2));
  const b3=13*Math.exp(-Math.pow((h-41)/7.8,2));
  return Math.max(0,b1+b2+b3+Math.max(0,Math.sin(h/2.3))*1.6);
}
function flowAt(h){ return 940 + (stageAt(h)-1.18)*3120 + Math.sin(h/3.3)*70; }  // m³/s no Jacuí
function accumRain(h){let s=0;for(let i=0;i<=h;i+=.5)s+=rainAt(i)*.5;return s}
const PEAK=(()=>{let v=0,h0=0;for(let h=0;h<=72;h+=0.1){const s=stageAt(h);if(s>v){v=s;h0=h}}return {h:h0,v}})();
const PEAK_H=PEAK.h, PEAK_STAGE=PEAK.v;

const NIVEIS={atencao:2.40, alerta:3.00, inundacao:4.50, emergencia:5.00};
function stageSev(v){ if(v>=NIVEIS.emergencia)return 'critico'; if(v>=NIVEIS.inundacao)return 'critico'; if(v>=NIVEIS.alerta)return 'alerta'; if(v>=NIVEIS.atencao)return 'atencao'; return 'normal'}

/* Série sintética por estação (offsets determinísticos por código) */
function stationSeries(est,h){
  const k=(parseInt(est.codigo.slice(-4))%97)/97;
  const lag=(est.bacia==='BAC-TAQUARI'?-7:est.bacia==='BAC-SINOS'?-3:est.bacia==='BAC-CAI'?-4:est.bacia==='BAC-JACUI'?-5:0)+k*2.4;
  const amp=est.bacia==='BAC-GUAIBA'?1:(0.55+k*0.8);
  const s=stageAt(h+lag)*amp*(0.7+k*0.6);
  return {nivel:Number(s.toFixed(2)), chuva:Number((rainAt(h+lag)*(0.6+k)).toFixed(1)), vazao:Math.round(flowAt(h+lag)*(0.15+k*0.9))};
}

function centroid(ring){let x=0,y=0;ring.forEach(p=>{x+=p[0];y+=p[1]});return [x/ring.length,y/ring.length]}
function expandRing(ring,f,noiseAmp,seedOff){
  const c=centroid(ring); const r=mulberry32(SEED+seedOff);

  let a=0; for(let i=0;i<ring.length;i++){const j=(i+1)%ring.length;

function projetarCusto(triId){
  const t = trimestre(triId);
  return DIMENSOES.map(d=>{
    const comps = d.comp.map(c=>{
      const conv = convergencia(t, c.conf);
      const largura = 0.60 - 0.40*conv;           // ±% em torno do valor central
      const central = c.base * t.sev;
      return {
        nome:c.n, cadeias:c.cad, conv,
        p25: central*(1-largura), p50: central, p75: central*(1+largura),
        conf: classeConf(conv), amplitude: largura*2
      };
    });
    const soma = k => comps.reduce((s,c)=>s+c[k],0);
    const convMedia = comps.reduce((s,c)=>s+c.conv,0)/comps.length;
    return {
      id:d.id, nome:d.nome, un:d.un, sev:d.sev, ic:d.ic, desc:d.desc, comp:comps,
      p25:soma('p25'), p50:soma('p50'), p75:soma('p75'),
      conv:convMedia, conf:classeConf(convMedia),
      amplitude:(soma('p75')-soma('p25'))/(soma('p50')||1)
    };
  });
}

<script>
/* ============================================================================
   M8 · SUPERFÍCIE DE IMPACTO DO EL NIÑO
   Grade regular sobre o território, interpolada a partir do sinal das doze
   regiões hidrográficas e ponderada pela exposição de cada uma. A superfície
   responde ao trimestre selecionado e aos parâmetros do simulador.
   ========================================================================== */

/* Contorno simplificado do Brasil — máscara para não pintar oceano nem vizinhos */
const BR_MASK = [
  [-51.6,4.3],[-50.0,4.4],[-51.0,1.0],[-48.5,-0.8],[-44.8,-2.5],[-41.0,-2.8],
  [-37.3,-5.0],[-35.2,-5.8],[-34.8,-7.2],[-35.5,-9.5],[-37.0,-11.0],[-38.5,-13.0],
  [-39.0,-17.5],[-40.5,-20.5],[-42.0,-22.9],[-45.0,-23.8],[-48.5,-25.5],[-48.6,-28.5],
  [-50.0,-30.5],[-52.2,-32.2],[-53.4,-33.7],[-55.6,-30.9],[-57.6,-30.2],[-56.0,-27.4],
  [-54.6,-25.6],[-54.3,-24.0],[-57.6,-22.1],[-58.0,-20.0],[-60.0,-16.3],[-58.4,-12.5],
  [-60.5,-10.0],[-65.3,-9.8],[-69.5,-10.9],[-70.6,-9.5],[-72.9,-9.0],[-73.9,-7.3],
  [-72.9,-5.1],[-70.0,-4.2],[-69.4,-1.1],[-69.8,0.6],[-67.3,1.9],[-67.1,2.8],
  [-64.0,4.1],[-60.7,5.2],[-60.0,4.6],[-59.8,3.9],[-57.3,3.3],[-55.9,2.5],[-54.5,2.3]
];
function dentroDoBrasil(lng,lat){
  let d=false;
  for(let i=0,j=BR_MASK.length-1;i<BR_MASK.length;j=i++){
    const xi=BR_MASK[i][0],yi=BR_MASK[i][1],xj=BR_MASK[j][0],yj=BR_MASK[j][1];
    if(((yi>lat)!==(yj>lat)) && (lng < (xj-xi)*(lat-yi)/((yj-yi)||1e-9)+xi)) d=!d;
  }
  return d;
}

/* Exposição relativa por região hidrográfica: população dependente das cadeias
   com gargalo, normalizada, com piso para não zerar regiões sem cadeia mapeada. */
const EXPO_RH = (()=>{
  const m={}; let max=1;
  REGIOES.forEach(r=>{
    const pop=CADEIAS_ENSO.filter(c=>c.rh===r.id).reduce((s,c)=>s+c.pop,0);
    const cad=CADEIAS_ENSO.filter(c=>c.rh===r.id).length;
    m[r.id]=pop/1e6 + cad*0.9;
    if(m[r.id]>max)max=m[r.id];
  });
  Object.keys(m).forEach(k=>m[k]=0.34+0.66*(m[k]/max));
  return m;
})();

/* Grade regular. Passo de 1,3° dá ~450 células sobre o território. */
const ENSO_GRID = (()=>{
  const cells=[], passo=1.3;
  for(let lng=-73.5; lng<=-34.5; lng+=passo){
    for(let lat=-33.5; lat<=5.2; lat+=passo){
      const cx=lng+passo/2, cy=lat+passo/2;
      if(!dentroDoBrasil(cx,cy))continue;
      // interpolação por distância inversa a partir das doze regiões
      let sw=0, sAnom=0, sSkill=0, sExpo=0, maisProx=null, dMin=1e9;
      REGIOES.forEach(r=>{
        const sg=ENSO_SINAL.find(x=>x.rh===r.id); if(!sg)return;
        const dx=(cx-r.lng)*Math.cos(cy*Math.PI/180), dy=cy-r.lat;
        const d2=dx*dx+dy*dy;
        if(d2<dMin){dMin=d2;maisProx=r.id}
        const w=1/Math.pow(d2+0.55,1.35);
        sw+=w; sAnom+=w*sg.chuva; sSkill+=w*sg.skill; sExpo+=w*(EXPO_RH[r.id]||0.4);
      });
      cells.push({x:lng,y:lat,p:passo,cx,cy,
        anom:sAnom/sw, skill:sSkill/sw, expo:sExpo/sw, rh:maisProx});
    }
  }
  return cells;
})();

/* Modos de visualização da superfície */
const ENSO_MODOS = [
  {id:'impacto', nome:'Índice de impacto',  desc:'Anomalia ponderada pela exposição das cadeias e pela aderência do sinal.'},
  {id:'anom',    nome:'Anomalia de chuva',  desc:'Desvio percentual em relação à média climatológica.'},
  {id:'seca',    nome:'Risco de seca',      desc:'Apenas o déficit, realçado onde há população dependente.'},
  {id:'cheia',   nome:'Risco de cheia',     desc:'Apenas o excesso, realçado onde há exposição urbana.'},
  {id:'custo',   nome:'Exposição financeira',desc:'Fração do custo projetado atribuível a cada célula.'}
];

/* Valor da célula no modo e trimestre correntes (0..1, com sinal em 'anom') */
function valorCelula(c, modo, sev, fatFin){
  const a = c.anom * sev;                       // anomalia efetiva no trimestre
  const conf = 0.55 + 0.45*c.skill;             // sinal fraco pesa menos
  switch(modo){
    case 'anom':  return clamp(a/32, -1, 1);
    case 'seca':  return a<0 ? clamp(Math.abs(a)/24 * (0.55+0.45*c.expo) * conf, 0, 1) : 0;
    case 'cheia': return a>0 ? clamp(a/27 * (0.55+0.45*c.expo) * conf, 0, 1) : 0;
    case 'custo': return clamp(Math.abs(a)/26 * (0.35+0.65*c.expo) * conf * (fatFin||1), 0, 1);
    default:      return clamp(Math.abs(a)/25 * (0.5+0.5*c.expo) * conf, 0, 1);
  }
}
/* Rampas: divergente para anomalia, sequencial para os demais */
function corENSO(v, modo){
  if(modo==='anom'){
    const t=clamp(Math.abs(v),0,1);
    return v<0 ? [Math.round(255-40*t), Math.round(196-122*t), Math.round(120-68*t)]
               : [Math.round(120-67*t), Math.round(184-24*t), Math.round(230+10*t)];
  }
  if(modo==='cheia'){const t=clamp(v,0,1);
    return [Math.round(150-125*t), Math.round(210-30*t), Math.round(235+5*t)];}
  const t=clamp(v,0,1);                          // verde → amarelo → laranja → vermelho
  if(t<0.34){const k=t/0.34;   return [Math.round(70+165*k),  Math.round(170+40*k), Math.round(110-40*k)]}
  if(t<0.67){const k=(t-0.34)/0.33; return [Math.round(235+15*k), Math.round(210-80*k), Math.round(70-20*k)]}
  const k=(t-0.67)/0.33;        return [Math.round(250+5*k),  Math.round(130-76*k), Math.round(50+10*k)];
}
function opacENSO(v, modo){
  const t=modo==='anom'?Math.abs(v):v;
  return t<0.05 ? 0 : clamp(0.22+0.54*t, 0, 0.78);
}

/* Estado da camada */
const ENSOMAP = { modo:'impacto', ligada:true, usarSim:false };

/* Estatísticas para a legenda e para o resumo da tela */
function statsENSO(){
  const t=trimestre(ENSOUI.tri);
  const fat=(ENSOMAP.usarSim&&typeof fatoresSim==='function')?fatoresSim().fin:1;
  const sev=(ENSOMAP.usarSim&&typeof SIM8!=='undefined')?t.sev*SIM8.sev:t.sev;
  let alto=0, medio=0, baixo=0, soma=0, pior=null, vPior=-1;
  ENSO_GRID.forEach(c=>{
    const v=Math.abs(valorCelula(c,ENSOMAP.modo,sev,fat));
    soma+=v;
    if(v>0.62)alto++; else if(v>0.34)medio++; else baixo++;
    if(v>vPior){vPior=v;pior=c}
  });
  return {alto,medio,baixo,total:ENSO_GRID.length,media:soma/ENSO_GRID.length,
    pior,vPior,sev,fat,
    rhPior:(REGIOES.find(r=>r.id===(pior||{}).rh)||{}).nome||'—'};
}
